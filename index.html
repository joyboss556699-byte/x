<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XR7 Task</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #eef1f5;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 100px;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        /* ===== হেডার ===== */
        .header {
            text-align: center;
            padding: 24px 20px 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        
        .header .icon {
            font-size: 36px;
            margin-bottom: 6px;
        }
        
        .header h1 {
            background: linear-gradient(135deg, #f0b429, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        
        .header .subtitle {
            color: #8b96a5;
            font-size: 13px;
            margin-top: 4px;
            -webkit-text-fill-color: #8b96a5;
        }
        
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(63, 185, 80, 0.15);
            border: 1px solid rgba(63, 185, 80, 0.25);
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: #3fb950;
            margin-top: 12px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: #3fb950;
            border-radius: 50%;
            animation: pulse 1.8s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }
        
        /* ===== কার্ড ===== */
        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            border-color: rgba(240, 180, 41, 0.15);
            box-shadow: 0 6px 32px rgba(0, 0, 0, 0.3);
        }
        
        /* ===== ফর্ম গ্রুপ ===== */
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group:last-child {
            margin-bottom: 0;
        }
        
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #9aa4b3;
            letter-spacing: 0.3px;
        }
        
        label .label-icon {
            margin-right: 6px;
        }
        
        label .required {
            color: #e5534b;
            margin-left: 4px;
        }
        
        select, input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #eef1f5;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            appearance: none;
            -webkit-appearance: none;
        }
        
        select:focus, input:focus {
            border-color: #f0b429;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(240, 180, 41, 0.1);
        }
        
        select option {
            background: #1a1a2e;
            color: #eef1f5;
        }
        
        input::placeholder {
            color: #5a6577;
        }
        
        /* ===== পেমেন্ট বাটন ===== */
        .payment-methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .payment-btn {
            padding: 14px 10px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            color: #c8d0dc;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .payment-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            opacity: 0;
            transition: opacity 0.4s ease;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent);
        }
        
        .payment-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }
        
        .payment-btn.active {
            transform: translateY(-3px);
            border-color: #f0b429;
            box-shadow: 0 8px 28px rgba(240, 180, 41, 0.25);
            color: #f0b429;
            background: rgba(240, 180, 41, 0.08);
        }
        
        .payment-btn.active::after {
            opacity: 1;
        }
        
        /* পেমেন্ট বাটন — রঙিন */
        .payment-btn[data-method="বিকাশ"] { border-color: rgba(233, 30, 99, 0.3); color: #f06292; }
        .payment-btn[data-method="বিকাশ"].active { border-color: #e91e63; background: rgba(233, 30, 99, 0.15); box-shadow: 0 8px 28px rgba(233, 30, 99, 0.3); color: #ff80ab; }
        
        .payment-btn[data-method="নগদ"] { border-color: rgba(255, 152, 0, 0.3); color: #ffb74d; }
        .payment-btn[data-method="নগদ"].active { border-color: #ff9800; background: rgba(255, 152, 0, 0.15); box-shadow: 0 8px 28px rgba(255, 152, 0, 0.3); color: #ffcc80; }
        
        .payment-btn[data-method="রকেট"] { border-color: rgba(156, 39, 176, 0.3); color: #ce93d8; }
        .payment-btn[data-method="রকেট"].active { border-color: #9c27b0; background: rgba(156, 39, 176, 0.15); box-shadow: 0 8px 28px rgba(156, 39, 176, 0.3); color: #e1bee7; }
        
        .payment-btn[data-method="ব্যাংক"] { border-color: rgba(33, 150, 243, 0.3); color: #64b5f6; }
        .payment-btn[data-method="ব্যাংক"].active { border-color: #2196f3; background: rgba(33, 150, 243, 0.15); box-shadow: 0 8px 28px rgba(33, 150, 243, 0.3); color: #90caf9; }
        
        /* ===== সামারি ===== */
        .summary {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            padding: 16px 18px;
            margin-top: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 14px;
            color: #8b96a5;
        }
        
        .summary-row .value {
            color: #d4dce8;
            font-weight: 500;
        }
        
        .summary-row.total {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin-top: 8px;
            padding-top: 12px;
            font-size: 18px;
            font-weight: 700;
            color: #eef1f5;
        }
        
        .summary-row.total .value {
            background: linear-gradient(135deg, #f0b429, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* ===== সাবমিট বাটন ===== */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f0b429, #f5c842);
            color: #1a1400;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 16px;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 28px rgba(240, 180, 41, 0.3);
        }
        
        .submit-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(240, 180, 41, 0.4);
        }
        
        .submit-btn:active:not(:disabled) {
            transform: translateY(-1px);
        }
        
        .submit-btn:disabled {
            background: #2a2a3e;
            color: #5a5a6e;
            box-shadow: none;
            cursor: not-allowed;
        }
        
        /* ===== নোট বক্স ===== */
        .note-box {
            background: rgba(240, 180, 41, 0.08);
            border: 1px solid #7a5c15;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
            color: #f0b429;
            margin-bottom: 16px;
            display: none;
            line-height: 1.5;
        }
        
        /* ===== লোডিং ===== */
        .loading {
            text-align: center;
            padding: 50px 20px;
        }
        
        .loading .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.06);
            border-top: 3px solid #f0b429;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 16px;
        }
        
        .loading p {
            color: #6a7588;
            font-size: 14px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* ===== মেসেজ ===== */
        .error {
            background: rgba(229, 83, 75, 0.12);
            border: 1px solid rgba(229, 83, 75, 0.2);
            color: #e5534b;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 14px;
        }
        
        .success {
            background: rgba(63, 185, 80, 0.12);
            border: 1px solid rgba(63, 185, 80, 0.2);
            color: #3fb950;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 14px;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== হেডার ===== -->
        <div class="header">
            <div class="icon">🚀</div>
            <h1>XR7 Task</h1>
            <div class="subtitle">কয়েন সেল করুন • সহজে • দ্রুত</div>
            <div class="status">
                <span class="status-dot"></span>
                <span id="statusText">লোড হচ্ছে...</span>
            </div>
        </div>

        <!-- ===== মেসেজ ===== -->
        <div id="messageArea"></div>

        <!-- ===== লোডিং ===== -->
        <div id="loadingArea" class="loading">
            <div class="spinner"></div>
            <p>ডেটা লোড হচ্ছে...</p>
        </div>

        <!-- ===== ফর্ম ===== -->
        <div id="formArea" class="hidden">
            <div class="card">
                <div class="form-group">
                    <label><span class="label-icon">🪙</span> কোন কয়েন বিক্রি করবেন?</label>
                    <select id="coinSelect" required>
                        <option value="">লোড হচ্ছে...</option>
                    </select>
                </div>

                <!-- ইউজারনেম ফিল্ড (শুধু Niva Coin-এর জন্য) -->
                <div class="form-group" id="usernameGroup" style="display: none;">
                    <label><span class="label-icon">📸</span> Instagram ইউজারনেম <span class="required">*</span></label>
                    <input type="text" id="usernameInput" placeholder="আপনার Instagram ইউজারনেম লিখুন">
                    <small style="color: #8b96a5; font-size: 12px; display: block; margin-top: 4px;">📌 Niva Coin সেল করতে আপনার Instagram ইউজারনেম দিন</small>
                </div>

                <div class="form-group">
                    <label><span class="label-icon">🔢</span> পরিমাণ (কয়েন সংখ্যা)</label>
                    <input type="number" id="amountInput" placeholder="যেমন: 1000" min="1" value="1000">
                </div>

                <div class="form-group">
                    <label><span class="label-icon">💳</span> পেমেন্ট মেথড</label>
                    <div class="payment-methods" id="paymentMethods"></div>
                </div>

                <div class="form-group">
                    <label><span class="label-icon">📱</span> অ্যাকাউন্ট নাম্বার</label>
                    <input type="text" id="accountNumber" placeholder="বিকাশ / নগদ / রকেট / ব্যাংক নাম্বার">
                </div>

                <!-- কুপন কোড ফিল্ড (শুধু TOP Follow Coin-এর জন্য) -->
                <div class="form-group" id="couponGroup" style="display: none;">
                    <label><span class="label-icon">🎟️</span> কুপন / কোড <span class="required">*</span></label>
                    <input type="text" id="couponCode" placeholder="আপনার কুপন কোড লিখুন">
                    <small style="color: #8b96a5; font-size: 12px; display: block; margin-top: 4px;">🎟️ TOP Follow Coin সেল করতে আপনার কুপন কোড দিন</small>
                </div>

                <div class="note-box" id="noteBox"></div>

                <!-- ===== সামারি ===== -->
                <div class="summary">
                    <div class="summary-row">
                        <span>💵 রেট</span>
                        <span class="value" id="rateDisplay">—</span>
                    </div>
                    <div class="summary-row">
                        <span>📦 পরিমাণ</span>
                        <span class="value" id="amountDisplay">0 কয়েন</span>
                    </div>
                    <div class="summary-row total">
                        <span>💰 মোট পাবেন</span>
                        <span class="value" id="totalAmount">0.00 টাকা</span>
                    </div>
                </div>

                <button class="submit-btn" id="submitBtn" disabled>✅ সেল রিকোয়েস্ট পাঠান</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== Firebase Config ====================
        const firebaseConfig = {
            apiKey: "AIzaSyBvZ8H5K9qJxYqKxYqKxYqKxYqKxYqKxYq",
            authDomain: "social-media-task-88c67.firebaseapp.com",
            projectId: "social-media-task-88c67",
            storageBucket: "social-media-task-88c67.firebasestorage.app",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abc123"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const tg = window.Telegram.WebApp;
        tg.expand();

        let COINS = {};
        let PAYMENT_METHODS = [];
        let sellingStatus = 'closed';
        let selectedCoinName = null;
        let selectedMethod = null;

        const coinSelect = document.getElementById('coinSelect');
        const paymentMethodsDiv = document.getElementById('paymentMethods');
        const amountInput = document.getElementById('amountInput');
        const accountInput = document.getElementById('accountNumber');
        const usernameGroup = document.getElementById('usernameGroup');
        const usernameInput = document.getElementById('usernameInput');
        const couponGroup = document.getElementById('couponGroup');
        const couponInput = document.getElementById('couponCode');
        const submitBtn = document.getElementById('submitBtn');
        const statusText = document.getElementById('statusText');
        const loadingArea = document.getElementById('loadingArea');
        const formArea = document.getElementById('formArea');
        const noteBox = document.getElementById('noteBox');

        // ==================== রেন্ডার ফাংশন ====================
        function renderStatus() {
            if (sellingStatus === 'open') {
                statusText.textContent = 'সেলিং চালু আছে';
            } else {
                statusText.textContent = 'সেলিং বন্ধ';
            }
            validateForm();
        }

        function renderCoins() {
            const activeCoins = Object.entries(COINS).filter(([_, c]) => c && c.active !== false);
            
            coinSelect.innerHTML = '<option value="">কয়েন সিলেক্ট করুন</option>';
            
            if (activeCoins.length === 0) {
                coinSelect.innerHTML = '<option value="">কোনো কয়েন নেই</option>';
                selectedCoinName = null;
                updateSummary();
                return;
            }

            if (!selectedCoinName || !COINS[selectedCoinName] || COINS[selectedCoinName].active === false) {
                selectedCoinName = activeCoins[0][0];
            }

            activeCoins.forEach(([name, coin]) => {
                const option = document.createElement('option');
                option.value = name;
                const rate = coin.rate || 0;
                const requiresUsername = coin.requires_username || false;
                const requiresCoupon = coin.requires_coupon_code || false;
                
                let label = `${name} — ${rate} টাকা (প্রতি ১০০০)`;
                if (requiresUsername) label += ' 📸';
                if (requiresCoupon) label += ' 🎟️';
                
                option.textContent = label;
                option.dataset.rate = rate;
                option.dataset.requiresUsername = requiresUsername;
                option.dataset.requiresCoupon = requiresCoupon;
                option.dataset.adminNote = coin.admin_note || '';
                if (name === selectedCoinName) {
                    option.selected = true;
                }
                coinSelect.appendChild(option);
            });

            // সিলেক্ট চেঞ্জ ইভেন্ট
            coinSelect.onchange = function() {
                selectedCoinName = this.value;
                updateSummary();
                showCoinNote();
            };

            updateSummary();
            showCoinNote();
        }

        function showCoinNote() {
            const selectedOption = coinSelect.options[coinSelect.selectedIndex];
            if (selectedOption && selectedOption.value) {
                const note = selectedOption.dataset.adminNote || '';
                if (note) {
                    noteBox.textContent = '📌 ' + note;
                    noteBox.style.display = 'block';
                } else {
                    noteBox.style.display = 'none';
                }
            } else {
                noteBox.style.display = 'none';
            }
        }

        function renderMethods() {
            const methods = PAYMENT_METHODS.length ? PAYMENT_METHODS : ["বিকাশ", "নগদ", "রকেট", "ব্যাংক"];
            if (!selectedMethod || !methods.includes(selectedMethod)) {
                selectedMethod = methods[0];
            }
            
            paymentMethodsDiv.innerHTML = '';
            methods.forEach((method) => {
                const btn = document.createElement('div');
                btn.className = 'payment-btn' + (method === selectedMethod ? ' active' : '');
                btn.textContent = method;
                btn.dataset.method = method;
                btn.addEventListener('click', () => {
                    selectedMethod = method;
                    renderMethods();
                    validateForm();
                });
                paymentMethodsDiv.appendChild(btn);
            });
        }

        function currentCoin() {
            return selectedCoinName ? COINS[selectedCoinName] : null;
        }

        function updateSummary() {
            const coin = currentCoin();
            const amount = parseInt(amountInput.value || '0', 10);
            const rate = coin ? (coin.rate || 0) : 0;
            const total = (amount / 1000) * rate;

            document.getElementById('rateDisplay').textContent = coin ? (rate + ' টাকা / ১,০০০ কয়েন') : '—';
            document.getElementById('amountDisplay').textContent = amount.toLocaleString('en-US') + ' কয়েন';
            document.getElementById('totalAmount').textContent = total.toFixed(2) + ' টাকা';

            const selectedOption = coinSelect.options[coinSelect.selectedIndex];
            if (selectedOption && selectedOption.value) {
                const requiresUsername = selectedOption.dataset.requiresUsername === 'true';
                const requiresCoupon = selectedOption.dataset.requiresCoupon === 'true';
                
                usernameGroup.style.display = requiresUsername ? 'block' : 'none';
                couponGroup.style.display = requiresCoupon ? 'block' : 'none';
                
                if (!requiresUsername) usernameInput.value = '';
                if (!requiresCoupon) couponInput.value = '';
            } else {
                usernameGroup.style.display = 'none';
                couponGroup.style.display = 'none';
            }

            validateForm();
        }

        function validateForm() {
            const coin = currentCoin();
            const amount = parseInt(amountInput.value || '0', 10);
            const account = accountInput.value.trim();
            const selectedOption = coinSelect.options[coinSelect.selectedIndex];
            
            const requiresUsername = selectedOption && selectedOption.dataset.requiresUsername === 'true';
            const usernameOk = !requiresUsername || usernameInput.value.trim().length > 0;
            
            const requiresCoupon = selectedOption && selectedOption.dataset.requiresCoupon === 'true';
            const couponOk = !requiresCoupon || couponInput.value.trim().length > 0;

            const amountOk = amount > 0;
            const accountOk = account.length >= 6;

            const formValid = sellingStatus === 'open' && !!coin && amountOk && accountOk && !!selectedMethod && usernameOk && couponOk;
            submitBtn.disabled = !formValid;
        }

        // ==================== ইভেন্ট লিসেনার ====================
        amountInput.addEventListener('input', updateSummary);
        accountInput.addEventListener('input', validateForm);
        usernameInput.addEventListener('input', validateForm);
        couponInput.addEventListener('input', validateForm);

        // ==================== সাবমিট ====================
        submitBtn.addEventListener('click', () => {
            const coin = currentCoin();
            if (!coin || !selectedCoinName) return;

            const amount = parseInt(amountInput.value || '0', 10);
            const account = accountInput.value.trim();
            const total = (amount / 1000) * (coin.rate || 0);
            
            const selectedOption = coinSelect.options[coinSelect.selectedIndex];
            const requiresUsername = selectedOption && selectedOption.dataset.requiresUsername === 'true';
            const requiresCoupon = selectedOption && selectedOption.dataset.requiresCoupon === 'true';

            const payload = {
                action: "xr7_sell_request",
                coin_name: selectedCoinName,
                amount: amount,
                payment_method: selectedMethod,
                account_number: account,
                estimated_total: Number(total.toFixed(2))
            };

            if (requiresUsername) {
                payload.username = usernameInput.value.trim();
            }

            if (requiresCoupon) {
                payload.coupon_code = couponInput.value.trim();
            }

            tg.sendData(JSON.stringify(payload));

            document.getElementById('formArea').classList.add('hidden');
            document.getElementById('loadingArea').classList.remove('hidden');
            document.querySelector('#loadingArea p').textContent = '✅ রিকোয়েস্ট পাঠানো হয়েছে!';

            setTimeout(() => tg.close(), 2000);
        });

        // ==================== ডেটা লোড ====================
        async function loadData() {
            try {
                const doc = await db.collection('xr7_settings').doc('main').get();

                if (!doc.exists) {
                    statusText.textContent = 'সেটিংস নেই';
                    return;
                }

                const data = doc.data();
                COINS = data.coins || {};
                PAYMENT_METHODS = data.payment_methods || [];
                sellingStatus = data.selling_status || 'closed';

                renderStatus();
                renderCoins();
                renderMethods();

                loadingArea.classList.add('hidden');
                formArea.classList.remove('hidden');

            } catch (error) {
                console.error('Load error:', error);
                statusText.textContent = 'ডেটা লোড হয়নি';
            }
        }

        window.addEventListener('load', loadData);
    </script>
</body>
</html>
