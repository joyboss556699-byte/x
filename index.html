<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XR7 PANEL - কয়েন সেল</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0a0a1a;
            color: #fff; 
            padding: 15px;
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* নোটিশ বক্স */
        .notification-box {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 5px 20px rgba(238, 90, 36, 0.4);
            animation: slideDown 0.5s ease;
            border: 1px solid rgba(255,255,255,0.2);
            display: none;
        }
        .notification-box.show { display: block; }
        .notification-box .notif-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .notification-box .notif-header h3 { 
            font-size: 15px; 
            color: #fff;
        }
        .notification-box p { 
            font-size: 13px; 
            line-height: 1.5; 
            color: rgba(255,255,255,0.95);
        }
        .notification-box .time { 
            font-size: 11px; 
            opacity: 0.8; 
            margin-top: 8px;
            display: block;
            color: rgba(255,255,255,0.8);
        }
        
        /* হেডার */
        .header { 
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 25px 20px; 
            border-radius: 16px; 
            text-align: center;
            margin-bottom: 15px;
            border: 1px solid rgba(255,215,0,0.3);
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
        }
        .header h1 { 
            color: #FFD700; 
            font-size: 28px; 
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
        }
        .header p { color: #aaa; font-size: 14px; margin-bottom: 15px; }
        .status { 
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px; 
            background: linear-gradient(135deg, #00b894, #00cec9);
            border-radius: 20px; 
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 3px 15px rgba(0, 184, 148, 0.4);
        }
        .status::before { 
            content: "●"; 
            color: #fff; 
            font-size: 10px;
            animation: blink 1.5s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* ফর্ম গ্রুপ */
        .form-group { 
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 20px; 
            border-radius: 14px; 
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 3px 15px rgba(0,0,0,0.2);
        }
        .form-group label { 
            display: block; 
            margin-bottom: 10px; 
            font-weight: 600; 
            color: #ddd;
            font-size: 14px;
        }
        
        /* সিলেক্ট এবং ইনপুট */
        select, input[type="text"], input[type="number"] { 
            width: 100%; 
            padding: 14px 16px; 
            border: 2px solid rgba(255,255,255,0.15); 
            border-radius: 10px; 
            background: rgba(255,255,255,0.08); 
            color: #fff; 
            font-size: 15px;
            transition: all 0.3s;
        }
        select:focus, input:focus { 
            outline: none;
            border-color: #FFD700;
            background: rgba(255,255,255,0.12);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }
        select option { 
            background: #1a1a2e; 
            color: #fff; 
        }
        input::placeholder { color: #666; }
        
        /* পেমেন্ট বাটন - সুন্দর রঙিন */
        .payment-methods { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            margin: 10px 0;
        }
        .payment-btn { 
            padding: 14px; 
            border: 2px solid rgba(255,255,255,0.15); 
            border-radius: 12px; 
            background: rgba(255,255,255,0.08); 
            color: #fff; 
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 700;
            font-size: 14px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .payment-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .payment-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .payment-btn.active { 
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        
        /* বিকাশ - গোলাপি */
        .payment-btn[data-method="বিকাশ"] {
            border-color: #e91e63;
            background: linear-gradient(135deg, rgba(233,30,99,0.2), rgba(233,30,99,0.1));
            color: #ff6090;
        }
        .payment-btn[data-method="বিকাশ"].active {
            background: linear-gradient(135deg, #e91e63, #c2185b);
            color: #fff;
            box-shadow: 0 8px 25px rgba(233, 30, 99, 0.5);
        }
        
        /* নগদ - কমলা */
        .payment-btn[data-method="নগদ"] {
            border-color: #ff9800;
            background: linear-gradient(135deg, rgba(255,152,0,0.2), rgba(255,152,0,0.1));
            color: #ffb74d;
        }
        .payment-btn[data-method="নগদ"].active {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: #fff;
            box-shadow: 0 8px 25px rgba(255, 152, 0, 0.5);
        }
        
        /* রকেট - বেগুনি */
        .payment-btn[data-method="রকেট"] {
            border-color: #9c27b0;
            background: linear-gradient(135deg, rgba(156,39,176,0.2), rgba(156,39,176,0.1));
            color: #ce93d8;
        }
        .payment-btn[data-method="রকেট"].active {
            background: linear-gradient(135deg, #9c27b0, #7b1fa2);
            color: #fff;
            box-shadow: 0 8px 25px rgba(156, 39, 176, 0.5);
        }
        
        /* ব্যাংক - নীল */
        .payment-btn[data-method="ব্যাংক"] {
            border-color: #2196f3;
            background: linear-gradient(135deg, rgba(33,150,243,0.2), rgba(33,150,243,0.1));
            color: #64b5f6;
        }
        .payment-btn[data-method="ব্যাংক"].active {
            background: linear-gradient(135deg, #2196f3, #1976d2);
            color: #fff;
            box-shadow: 0 8px 25px rgba(33, 150, 243, 0.5);
        }
        
        /* ইনফো বক্স */
        .info-box { 
            background: linear-gradient(135deg, rgba(255,193,7,0.15), rgba(255,193,7,0.05)); 
            border-left: 4px solid #FFC107; 
            padding: 14px; 
            border-radius: 10px; 
            margin: 15px 0;
        }
        .rate-info { color: #FFD700; font-size: 22px; font-weight: bold; }
        
        /* টোটাল বক্স */
        .total-box { 
            background: linear-gradient(135deg, #00b894, #00cec9); 
            padding: 20px; 
            border-radius: 14px; 
            text-align: center;
            margin: 20px 0;
            box-shadow: 0 5px 25px rgba(0, 184, 148, 0.3);
        }
        .total-label { font-size: 14px; margin-bottom: 8px; opacity: 0.9; }
        .total-amount { 
            font-size: 36px; 
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .coin-amount {
            font-size: 16px;
            margin-top: 8px;
            opacity: 0.9;
        }
        
        /* সাবমিট বাটন */
        .submit-btn { 
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(135deg, #6c5ce7, #a29bfe); 
            border: none; 
            border-radius: 12px; 
            color: #fff; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(108, 92, 231, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .submit-btn:hover { 
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(108, 92, 231, 0.6);
        }
        .submit-btn:active { transform: translateY(-1px); }
        .submit-btn:disabled { 
            background: #555; 
            cursor: not-allowed; 
            transform: none;
            box-shadow: none;
        }
        
        /* লোডিং */
        .loading { 
            text-align: center; 
            padding: 50px 20px; 
            color: #FFD700;
        }
        .loading p { 
            font-size: 16px;
            animation: fadeInOut 1.5s ease-in-out infinite;
        }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        /* এরর */
        .error { 
            background: linear-gradient(135deg, rgba(231,76,60,0.2), rgba(231,76,60,0.1)); 
            border-left: 4px solid #e74c3c; 
            padding: 15px; 
            border-radius: 10px; 
            margin: 15px 0;
            color: #ff6b6b;
        }
        
        /* হিডেন */
        .hidden { display: none; }
        
        /* অ্যানিমেশন */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- নোটিশ বক্স -->
        <div id="notificationBox" class="notification-box">
            <div class="notif-header">
                <h3>📢 গুরুত্বপূর্ণ নোটিশ</h3>
            </div>
            <p id="notificationText"></p>
            <span class="time" id="notificationTime"></span>
        </div>

        <!-- হেডার -->
        <div class="header">
            <h1>✨ XR7 PANEL</h1>
            <p>কয়েন সেল করুন এবং আয় করুন</p>
            <div class="status">সেলিং চালু আছে</div>
        </div>

        <!-- লোডিং -->
        <div id="loading" class="loading">
            <p>⏳ লোড হচ্ছে...</p>
        </div>

        <!-- এরর -->
        <div id="error" class="error hidden"></div>

        <!-- মেইন কন্টেন্ট -->
        <div id="content" class="hidden">
            <form id="sellForm">
                <div class="form-group">
                    <label>🪙 কোন কয়েন বিক্রি করবেন?</label>
                    <select id="coinSelect" required>
                        <option value="">কয়েন নির্বাচন করুন</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>💰 পরিমাণ (কয়েন সংখ্যা)</label>
                    <input type="number" id="amount" placeholder="উদাহরণ: 1000" min="100" step="100" required>
                </div>

                <div class="form-group">
                    <label>💳 পেমেন্ট মেথড নির্বাচন করুন</label>
                    <div class="payment-methods">
                        <button type="button" class="payment-btn" data-method="বিকাশ">বিকাশ</button>
                        <button type="button" class="payment-btn" data-method="নগদ">নগদ</button>
                        <button type="button" class="payment-btn" data-method="রকেট">রকেট</button>
                        <button type="button" class="payment-btn" data-method="ব্যাংক">ব্যাংক</button>
                    </div>
                    <input type="hidden" id="paymentMethod" required>
                </div>

                <div class="form-group">
                    <label> অ্যাকাউন্ট নাম্বার</label>
                    <input type="text" id="accountNumber" placeholder="আপনার অ্যাকাউন্ট নাম্বার লিখুন" required>
                </div>

                <div class="form-group">
                    <label>🎟️ কুপন / কোড (ঐচ্ছিক)</label>
                    <input type="text" id="couponCode" placeholder="কুপন কোড থাকলে লিখুন">
                </div>

                <div class="info-box">
                    <div>💵 রেট: <span id="rateDisplay" class="rate-info">—</span></div>
                    <small style="opacity: 0.8; color: #aaa;">প্রতি ১,০০০ কয়েন</small>
                </div>

                <div class="total-box">
                    <div class="total-label">💰 মোট পাবেন</div>
                    <div class="total-amount">৳ <span id="totalAmount">0.00</span></div>
                    <div class="coin-amount"><span id="coinAmount">0</span> কয়েন</div>
                </div>

                <button type="submit" class="submit-btn">
                    ✅ সেল রিকোয়েস্ট পাঠান
                </button>
            </form>
        </div>
    </div>

    <script>
        // Firebase কনফিগারেশন
        const firebaseConfig = {
    apiKey: "AIzaSyBvZ8H5K9qJxYqKxYqKxYqKxYqKxYqKxYq",
    authDomain: "social-media-task-88c67.firebaseapp.com",
    projectId: "social-media-task-88c67",
    storageBucket: "social-media-task-88c67.firebasestorage.app",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abc123"
};

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let coinsData = {};
        let selectedPaymentMethod = '';

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await Promise.all([
                    loadNotifications(),
                    loadSettings()
                ]);
            } catch (error) {
                showError("ডেটা লোড করতে সমস্যা: " + error.message);
            }
        });

        // নোটিশ লোড
        async function loadNotifications() {
            try {
                const notificationsRef = db.collection('xr7_notifications')
                    .where('active', '==', true)
                    .orderBy('createdAt', 'desc')
                    .limit(1);
                
                const snapshot = await notificationsRef.get();
                
                if (!snapshot.empty) {
                    const notification = snapshot.docs[0].data();
                    showNotification(notification);
                }
            } catch (error) {
                console.error('Notification Error:', error);
            }
        }

        function showNotification(notification) {
            const box = document.getElementById('notificationBox');
            const text = document.getElementById('notificationText');
            const time = document.getElementById('notificationTime');
            
            text.textContent = notification.message || '';
            
            if (notification.createdAt) {
                const date = notification.createdAt.toDate ? 
                    notification.createdAt.toDate() : new Date(notification.createdAt);
                time.textContent = '📅 ' + date.toLocaleString('bn-BD');
            }
            
            box.classList.add('show');
        }

        // সেটিংস লোড
        async function loadSettings() {
            try {
                const settingsDoc = await db.collection('xr7_settings').doc('main').get();
                
                if (!settingsDoc.exists) {
                    throw new Error('সেটিংস পাওয়া যায়নি');
                }

                const data = settingsDoc.data();
                
                if (data.selling_status !== 'open') {
                    throw new Error('সেলিং বর্তমানে বন্ধ আছে');
                }

                coinsData = data.coins || {};
                
                const select = document.getElementById('coinSelect');
                select.innerHTML = '<option value="">কয়েন নির্বাচন করুন</option>';
                
                let activeCoins = 0;
                for (const [coinName, coinData] of Object.entries(coinsData)) {
                    if (coinData.active) {
                        const option = document.createElement('option');
                        option.value = coinName;
                        option.textContent = `${coinName} - ৳${coinData.rate} (প্রতি ১,০০০)`;
                        option.dataset.rate = coinData.rate;
                        select.appendChild(option);
                        activeCoins++;
                    }
                }

                if (activeCoins === 0) {
                    throw new Error('কোনো সক্রিয় কয়েন নেই');
                }

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');

                select.addEventListener('change', updateTotal);
                document.getElementById('amount').addEventListener('input', updateTotal);
                document.getElementById('sellForm').addEventListener('submit', handleSubmit);
                
                document.querySelectorAll('.payment-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.payment-btn').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        selectedPaymentMethod = this.dataset.method;
                        document.getElementById('paymentMethod').value = selectedPaymentMethod;
                    });
                });

            } catch (error) {
                throw error;
            }
        }

        function updateTotal() {
            const select = document.getElementById('coinSelect');
            const amount = document.getElementById('amount').value;
            
            if (select.value && amount) {
                const rate = parseFloat(select.options[select.selectedIndex].dataset.rate);
                const total = (amount / 1000) * rate;
                document.getElementById('totalAmount').textContent = total.toFixed(2);
                document.getElementById('coinAmount').textContent = parseInt(amount).toLocaleString('bn-BD');
                document.getElementById('rateDisplay').textContent = `৳${rate}`;
            }
        }

        async function handleSubmit(e) {
            e.preventDefault();
            
            if (!selectedPaymentMethod) {
                alert('দয়া করে একটি পেমেন্ট মেথড নির্বাচন করুন!');
                return;
            }
            
            const coinName = document.getElementById('coinSelect').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const accountNumber = document.getElementById('accountNumber').value;
            const couponCode = document.getElementById('couponCode').value;

            if (!coinName || !amount || !accountNumber) {
                alert('সব তথ্য পূরণ করুন!');
                return;
            }

            const rate = coinsData[coinName].rate;
            const totalPrice = (amount / 1000) * rate;

            const data = {
                coin_name: coinName,
                amount: amount,
                payment_method: selectedPaymentMethod,
                account_number: accountNumber,
                coupon_code: couponCode || '',
                total_price: totalPrice
            };

            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.sendData(JSON.stringify(data));
                window.Telegram.WebApp.close();
            } else {
                alert('দয়া করে Telegram Mini App থেকে খুলুন!');
            }
        }

        function showError(msg) {
            document.getElementById('loading').classList.add('hidden');
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = ' ' + msg;
            errorDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
