<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XR7 Task</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0e1116;
            color: #eef1f5;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 20px;
            background: #161b22;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid #2a323d;
        }
        .header h1 { color: #f0b429; font-size: 24px; }
        .header .subtitle { color: #8b96a5; font-size: 14px; margin-top: 5px; }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(63,185,80,0.15);
            border-radius: 20px;
            font-size: 13px;
            color: #3fb950;
            margin-top: 10px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #3fb950;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .card {
            background: #161b22;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #2a323d;
        }
        .debug-info {
            background: #0a0c10;
            padding: 12px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 11px;
            color: #3fb950;
            overflow-x: auto;
            margin-bottom: 20px;
            border: 1px solid #1d232c;
            display: none;
        }
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #8b96a5;
            font-weight: 600;
        }
        select, input {
            width: 100%;
            padding: 14px;
            border: 1.5px solid #2a323d;
            border-radius: 12px;
            background: #0e1116;
            color: #eef1f5;
            font-size: 16px;
            outline: none;
        }
        select:focus, input:focus { border-color: #f0b429; }
        select option { background: #0e1116; color: #eef1f5; }
        .payment-methods {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .payment-btn {
            padding: 14px;
            border: 1.5px solid #2a323d;
            border-radius: 12px;
            background: #0e1116;
            color: #eef1f5;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        .payment-btn.active {
            border-color: #f0b429;
            background: rgba(240,180,41,0.1);
            color: #f0b429;
        }
        .summary {
            background: #0a0c10;
            padding: 16px;
            border-radius: 12px;
            margin-top: 16px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 14px;
            color: #8b96a5;
        }
        .summary-row.total {
            border-top: 1px solid #2a323d;
            margin-top: 8px;
            padding-top: 12px;
            font-size: 18px;
            font-weight: 700;
            color: #eef1f5;
        }
        .total-amount { color: #f0b429; }
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #f0b429;
            color: #1a1400;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 16px;
        }
        .submit-btn:disabled {
            background: #3a3a2e;
            color: #6b6b5a;
            cursor: not-allowed;
        }
        .error {
            background: rgba(229,83,75,0.1);
            border: 1px solid #e5534b;
            color: #e5534b;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            text-align: center;
        }
        .success {
            background: rgba(63,185,80,0.1);
            border: 1px solid #3fb950;
            color: #3fb950;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            text-align: center;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #8b96a5;
        }
        .spinner {
            border: 3px solid #2a323d;
            border-top: 3px solid #f0b429;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>XR7 Task</h1>
            <div class="subtitle">কয়েন সেল করুন</div>
            <div style="margin-top: 12px;">
                <div class="status">
                    <div class="status-dot"></div>
                    <span id="statusText">লোড হচ্ছে...</span>
                </div>
            </div>
        </div>

        <div id="debugInfo" class="debug-info"></div>
        <div id="messageArea"></div>

        <div id="loadingArea" class="loading">
            <div class="spinner"></div>
            <p>ডেটা লোড হচ্ছে...</p>
        </div>

        <div id="formArea" style="display: none;">
            <div class="card">
                <div class="form-group">
                    <label>কোন কয়েন বিক্রি করবেন</label>
                    <select id="coinSelect" required>
                        <option value="">লোড হচ্ছে...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>পরিমাণ (কয়েন সংখ্যা)</label>
                    <input type="number" id="amountInput" placeholder="যেমন: 1000" min="1" value="1000">
                </div>

                <div class="form-group">
                    <label>পেমেন্ট মেথড</label>
                    <div class="payment-methods" id="paymentMethods"></div>
                </div>

                <div class="form-group">
                    <label>অ্যাকাউন্ট নাম্বার</label>
                    <input type="text" id="accountNumber" placeholder="বিকাশ/নগদ/রকেট/ব্যাংক নাম্বার">
                </div>

                <div class="form-group" id="couponGroup" style="display: none;">
                    <label>কুপন / কোড</label>
                    <input type="text" id="couponCode" placeholder="কুপন/কোড দিন">
                </div>

                <div class="summary">
                    <div class="summary-row">
                        <span>রেট</span>
                        <span id="rateDisplay">—</span>
                    </div>
                    <div class="summary-row">
                        <span>পরিমাণ</span>
                        <span id="amountDisplay">0 কয়েন</span>
                    </div>
                    <div class="summary-row total">
                        <span>মোট পাবেন</span>
                        <span class="total-amount" id="totalAmount">0.00 টাকা</span>
                    </div>
                </div>
            </div>

            <button class="submit-btn" id="submitBtn" disabled>সেল রিকোয়েস্ট পাঠান</button>
        </div>
    </div>

    <script>
        // ==================== 🔥 Firebase Config (social-media-task) ====================
        const firebaseConfig = {
            apiKey: "AIzaSyBvZ8H5K9qJxYqKxYqKxYqKxYqKxYqKxYq",
            authDomain: "social-media-task-88c67.firebaseapp.com",
            projectId: "social-media-task-88c67",
            storageBucket: "social-media-task-88c67.firebasestorage.app",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abc123"
        };

        // ==================== Firebase Initialize ====================
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ==================== Telegram WebApp ====================
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ==================== State ====================
        let COINS = {};
        let PAYMENT_METHODS = [];
        let sellingStatus = 'closed';
        let selectedCoinName = null;
        let selectedMethod = null;

        // ==================== DOM Elements ====================
        const coinSelect = document.getElementById('coinSelect');
        const paymentMethodsDiv = document.getElementById('paymentMethods');
        const amountInput = document.getElementById('amountInput');
        const accountInput = document.getElementById('accountNumber');
        const couponGroup = document.getElementById('couponGroup');
        const couponInput = document.getElementById('couponCode');
        const submitBtn = document.getElementById('submitBtn');
        const statusText = document.getElementById('statusText');
        const debugInfo = document.getElementById('debugInfo');
        const loadingArea = document.getElementById('loadingArea');
        const formArea = document.getElementById('formArea');

        // ==================== Debug ====================
        function updateDebug(text) {
            debugInfo.style.display = 'block';
            debugInfo.textContent = text;
        }

        // ==================== Render Functions ====================
        function renderStatus() {
            if (sellingStatus === 'open') {
                statusText.textContent = 'সেলিং চালু আছে';
            } else {
                statusText.textContent = 'সেলিং বন্ধ';
            }
            validateForm();
        }

        function renderCoins() {
            const activeCoins = Object.entries(COINS).filter(([_, c]) => c && c.active !== false);
            
            coinSelect.innerHTML = '<option value="">কয়েন সিলেক্ট করুন</option>';
            
            if (activeCoins.length === 0) {
                coinSelect.innerHTML = '<option value="">কোনো কয়েন নেই</option>';
                selectedCoinName = null;
                updateSummary();
                return;
            }

            if (!selectedCoinName || !COINS[selectedCoinName] || COINS[selectedCoinName].active === false) {
                selectedCoinName = activeCoins[0][0];
            }

            activeCoins.forEach(([name, coin]) => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = `${name} - ${coin.rate || 0} টাকা (প্রতি ১০০০)`;
                option.dataset.rate = coin.rate || 0;
                option.dataset.requiresCoupon = coin.requires_coupon_code || false;
                if (name === selectedCoinName) {
                    option.selected = true;
                }
                coinSelect.appendChild(option);
            });

            updateSummary();
        }

        function renderMethods() {
            const methods = PAYMENT_METHODS.length ? PAYMENT_METHODS : ["বিকাশ", "নগদ", "রকেট", "ব্যাংক"];
            if (!selectedMethod || !methods.includes(selectedMethod)) {
                selectedMethod = methods[0];
            }
            
            paymentMethodsDiv.innerHTML = '';
            methods.forEach((method) => {
                const btn = document.createElement('div');
                btn.className = 'payment-btn' + (method === selectedMethod ? ' active' : '');
                btn.textContent = method;
                btn.dataset.method = method;
                btn.addEventListener('click', () => {
                    selectedMethod = method;
                    renderMethods();
                    validateForm();
                });
                paymentMethodsDiv.appendChild(btn);
            });
        }

        function currentCoin() {
            return selectedCoinName ? COINS[selectedCoinName] : null;
        }

        function updateSummary() {
            const coin = currentCoin();
            const amount = parseInt(amountInput.value || '0', 10);
            const rate = coin ? (coin.rate || 0) : 0;
            const total = (amount / 1000) * rate;

            document.getElementById('rateDisplay').textContent = coin ? (rate + ' টাকা / ১,০০০ কয়েন') : '—';
            document.getElementById('amountDisplay').textContent = amount.toLocaleString('en-US') + ' কয়েন';
            document.getElementById('totalAmount').textContent = total.toFixed(2) + ' টাকা';

            // Coupon field
            if (coin && coin.requires_coupon_code) {
                couponGroup.style.display = 'block';
            } else {
                couponGroup.style.display = 'none';
                couponInput.value = '';
            }

            validateForm();
        }

        function validateForm() {
            const coin = currentCoin();
            const amount = parseInt(amountInput.value || '0', 10);
            const account = accountInput.value.trim();

            const amountOk = amount > 0;
            const accountOk = account.length >= 6;
            const couponNeeded = !!(coin && coin.requires_coupon_code);
            const couponOk = !couponNeeded || couponInput.value.trim().length > 0;

            const formValid = sellingStatus === 'open' && !!coin && amountOk && accountOk && !!selectedMethod && couponOk;
            submitBtn.disabled = !formValid;
        }

        // ==================== Event Listeners ====================
        coinSelect.addEventListener('change', () => {
            selectedCoinName = coinSelect.value;
            updateSummary();
        });

        amountInput.addEventListener('input', updateSummary);
        accountInput.addEventListener('input', validateForm);
        couponInput.addEventListener('input', validateForm);

        // ==================== Submit ====================
        submitBtn.addEventListener('click', () => {
            const coin = currentCoin();
            if (!coin || !selectedCoinName) return;

            const amount = parseInt(amountInput.value || '0', 10);
            const account = accountInput.value.trim();
            const total = (amount / 1000) * (coin.rate || 0);

            const payload = {
                action: "xr7_sell_request",
                coin_name: selectedCoinName,
                amount: amount,
                payment_method: selectedMethod,
                account_number: account,
                estimated_total: Number(total.toFixed(2))
            };

            if (coin.requires_coupon_code) {
                payload.coupon_code = couponInput.value.trim();
            }

            tg.sendData(JSON.stringify(payload));

            // Show success
            document.getElementById('formArea').style.display = 'none';
            document.getElementById('loadingArea').style.display = 'block';
            document.querySelector('#loadingArea p').textContent = '✅ রিকোয়েস্ট পাঠানো হয়েছে!';

            setTimeout(() => tg.close(), 2000);
        });

        // ==================== Load Data from Firestore ====================
        async function loadData() {
            try {
                updateDebug('⏳ Firebase থেকে ডেটা লোড হচ্ছে...');

                const doc = await db.collection('xr7_settings').doc('main').get();

                if (!doc.exists) {
                    updateDebug('❌ সেটিংস ডকুমেন্ট পাওয়া যায়নি!');
                    statusText.textContent = 'সেটিংস নেই';
                    return;
                }

                const data = doc.data();
                COINS = data.coins || {};
                PAYMENT_METHODS = data.payment_methods || [];
                sellingStatus = data.selling_status || 'closed';

                // Debug info
                let debugText = `📌 প্রজেক্ট: social-media-task-88c67\n`;
                debugText += `📌 স্ট্যাটাস: ${sellingStatus}\n`;
                debugText += `📌 কয়েন সংখ্যা: ${Object.keys(COINS).length}\n`;
                if (Object.keys(COINS).length > 0) {
                    debugText += `\n✅ সক্রিয় কয়েন:\n`;
                    for (const [name, c] of Object.entries(COINS)) {
                        if (c.active) {
                            debugText += `  • ${name}: ${c.rate} টাকা\n`;
                        }
                    }
                } else {
                    debugText += `\n❌ কোনো কয়েন নেই!`;
                }
                updateDebug(debugText);

                renderStatus();
                renderCoins();
                renderMethods();

                loadingArea.style.display = 'none';
                formArea.style.display = 'block';

            } catch (error) {
                console.error('Load error:', error);
                updateDebug(`❌ Error: ${error.message}`);
                statusText.textContent = 'ডেটা লোড হয়নি';
            }
        }

        // ==================== Start ====================
        window.addEventListener('load', loadData);
    </script>
</body>
</html>
