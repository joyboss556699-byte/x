<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XR7 PANEL - কয়েন সেল</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            padding: 15px;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* নোটিশ বক্স */
        .notification-box {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(238, 90, 36, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: none;
            animation: slideDown 0.5s ease;
        }

        .notification-box.show {
            display: block;
        }

        .notification-box .notif-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .notification-box .notif-header h3 {
            font-size: 16px;
            color: #fff;
        }

        .notification-box p {
            font-size: 14px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.95);
        }

        .notification-box .time {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 8px;
            display: block;
            color: rgba(255, 255, 255, 0.9);
        }

        /* হেডার */
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.1) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .header h1 {
            color: #FFD700;
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            position: relative;
            z-index: 1;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
            50% { text-shadow: 0 0 30px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 215, 0, 0.6); }
        }

        .header p {
            color: #e0e0e0;
            font-size: 18px;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 25px;
            background: linear-gradient(135deg, #00b894, #00cec9);
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0, 184, 148, 0.4);
            position: relative;
            z-index: 1;
            animation: pulseStatus 2s ease-in-out infinite;
        }

        @keyframes pulseStatus {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .status::before {
            content: "●";
            color: #fff;
            font-size: 12px;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ডিবাগ ইনফো */
        .debug-info {
            background: rgba(0, 255, 0, 0.1);
            border-left: 4px solid #00ff00;
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
            font-size: 13px;
            font-family: monospace;
            display: none;
        }

        /* ফর্ম গ্রুপ */
        .form-group {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .form-group:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .form-group label {
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
            color: #fff;
            font-size: 16px;
        }

        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #FFD700;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        select option {
            background: #2d2d44;
            color: #fff;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* পেমেন্ট বাটন */
        .payment-methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 15px 0;
        }

        .payment-btn {
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            font-size: 15px;
            text-align: center;
        }

        .payment-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .payment-btn.active {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        /* বিকাশ - গোলাপি */
        .payment-btn[data-method="বিকাশ"] {
            border-color: #e91e63;
            background: linear-gradient(135deg, rgba(233, 30, 99, 0.2), rgba(233, 30, 99, 0.1));
            color: #ff6090;
        }

        .payment-btn[data-method="বিকাশ"].active {
            background: linear-gradient(135deg, #e91e63, #c2185b);
            color: #fff;
            box-shadow: 0 8px 25px rgba(233, 30, 99, 0.5);
        }

        /* নগদ - কমলা */
        .payment-btn[data-method="নগদ"] {
            border-color: #ff9800;
            background: linear-gradient(135deg, rgba(255, 152, 0, 0.2), rgba(255, 152, 0, 0.1));
            color: #ffb74d;
        }

        .payment-btn[data-method="নগদ"].active {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: #fff;
            box-shadow: 0 8px 25px rgba(255, 152, 0, 0.5);
        }

        /* রকেট - বেগুনি */
        .payment-btn[data-method="রকেট"] {
            border-color: #9c27b0;
            background: linear-gradient(135deg, rgba(156, 39, 176, 0.2), rgba(156, 39, 176, 0.1));
            color: #ce93d8;
        }

        .payment-btn[data-method="রকেট"].active {
            background: linear-gradient(135deg, #9c27b0, #7b1fa2);
            color: #fff;
            box-shadow: 0 8px 25px rgba(156, 39, 176, 0.5);
        }

        /* ব্যাংক - নীল */
        .payment-btn[data-method="ব্যাংক"] {
            border-color: #2196f3;
            background: linear-gradient(135deg, rgba(33, 150, 243, 0.2), rgba(33, 150, 243, 0.1));
            color: #64b5f6;
        }

        .payment-btn[data-method="ব্যাংক"].active {
            background: linear-gradient(135deg, #2196f3, #1976d2);
            color: #fff;
            box-shadow: 0 8px 25px rgba(33, 150, 243, 0.5);
        }

        /* ইনফো বক্স */
        .info-box {
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.15), rgba(255, 193, 7, 0.05));
            border-left: 5px solid #FFC107;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .rate-info {
            color: #FFD700;
            font-size: 24px;
            font-weight: bold;
        }

        /* টোটাল বক্স */
        .total-box {
            background: linear-gradient(135deg, #00b894, #00cec9);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin: 25px 0;
            box-shadow: 0 10px 30px rgba(0, 184, 148, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .total-label {
            font-size: 16px;
            margin-bottom: 10px;
            opacity: 0.95;
        }

        .total-amount {
            font-size: 42px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .coin-amount {
            font-size: 18px;
            margin-top: 10px;
            opacity: 0.9;
        }

        /* সাবমিট বাটন */
        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 15px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.6);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* লোডিং */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #FFD700;
        }

        .loading p {
            font-size: 18px;
            animation: fadeInOut 1.5s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* এরর */
        .error {
            background: linear-gradient(135deg, rgba(231, 76, 60, 0.2), rgba(231, 76, 60, 0.1));
            border-left: 5px solid #e74c3c;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            color: #ff6b6b;
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.3);
        }

        /* হিডেন */
        .hidden {
            display: none;
        }

        /* অ্যানিমেশন */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* রেসপন্সিভ */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 28px;
            }
            .total-amount {
                font-size: 36px;
            }
            .payment-methods {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- নোটিশ বক্স -->
        <div id="notificationBox" class="notification-box">
            <div class="notif-header">
                <h3>📢 গুরুত্বপূর্ণ নোটিশ</h3>
            </div>
            <p id="notificationText"></p>
            <span class="time" id="notificationTime"></span>
        </div>

        <!-- হেডার -->
        <div class="header">
            <h1>✨ XR7 PANEL</h1>
            <p>কয়েন সেল করুন এবং আয় করুন</p>
            <div class="status">সেলিং চালু আছে</div>
        </div>

        <!-- লোডিং -->
        <div id="loading" class="loading">
            <p>⏳ লোড হচ্ছে...</p>
        </div>

        <!-- এরর -->
        <div id="error" class="error hidden"></div>

        <!-- ডিবাগ ইনফো -->
        <div id="debugInfo" class="debug-info"></div>

        <!-- মেইন কন্টেন্ট -->
        <div id="content" class="hidden">
            <form id="sellForm">
                <div class="form-group">
                    <label>🪙 কোন কয়েন বিক্রি করবেন?</label>
                    <select id="coinSelect" required>
                        <option value="">কয়েন লিস্ট লোড হচ্ছে...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>💰 পরিমাণ (কয়েন সংখ্যা)</label>
                    <input type="number" id="amount" placeholder="উদাহরণ: 1000" min="100" step="100" required>
                </div>

                <div class="form-group">
                    <label>💳 পেমেন্ট মেথড</label>
                    <div class="payment-methods">
                        <button type="button" class="payment-btn" data-method="বিকাশ">বিকাশ</button>
                        <button type="button" class="payment-btn" data-method="নগদ">নগদ</button>
                        <button type="button" class="payment-btn" data-method="রকেট">রকেট</button>
                        <button type="button" class="payment-btn" data-method="ব্যাংক">ব্যাংক</button>
                    </div>
                    <input type="hidden" id="paymentMethod" required>
                </div>

                <div class="form-group">
                    <label>🔢 অ্যাকাউন্ট নাম্বার</label>
                    <input type="text" id="accountNumber" placeholder="বিকাশ/নগদ/রকেট/ব্যাংক নাম্বার" required>
                </div>

                <div class="form-group">
                    <label>🎟️ কুপন / কোড</label>
                    <input type="text" id="couponCode" placeholder="ঐচ্ছিক">
                </div>

                <div class="info-box">
                    <div>রেট: <span id="rateDisplay" class="rate-info">—</span></div>
                </div>

                <div class="total-box">
                    <div class="total-label">💰 মোট পাবেন</div>
                    <div class="total-amount">৳ <span id="totalAmount">0.00</span></div>
                    <div class="coin-amount"><span id="coinAmount">0</span> কয়েন</div>
                </div>

                <button type="submit" class="submit-btn">
                    ✅ সেল রিকোয়েস্ট পাঠান
                </button>
            </form>
        </div>
    </div>

    <script>
        // Firebase কনফিগারেশন
        const firebaseConfig = {
    apiKey: "AIzaSyBvZ8H5K9qJxYqKxYqKxYqKxYqKxYqKxYq",
    authDomain: "social-media-task-88c67.firebaseapp.com",
    projectId: "social-media-task-88c67",
    storageBucket: "social-media-task-88c67.firebasestorage.app",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abc123"
};

        // Firebase ইনিশিয়ালাইজ
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let coinsData = {};
        let selectedPaymentMethod = '';

        // পেজ লোড হলে
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await Promise.all([
                    loadNotifications(),
                    loadSettings()
                ]);
            } catch (error) {
                showError("ডেটা লোড করতে সমস্যা: " + error.message);
            }
        });

        // নোটিশ লোড করা
        async function loadNotifications() {
            try {
                const notificationsRef = db.collection('xr7_notifications')
                    .where('active', '==', true)
                    .orderBy('createdAt', 'desc')
                    .limit(1);
                
                const snapshot = await notificationsRef.get();
                
                if (!snapshot.empty) {
                    const notification = snapshot.docs[0].data();
                    showNotification(notification);
                }
            } catch (error) {
                console.error('Notification Load Error:', error);
            }
        }

        // নোটিশ দেখানো
        function showNotification(notification) {
            const notificationBox = document.getElementById('notificationBox');
            const notificationText = document.getElementById('notificationText');
            const notificationTime = document.getElementById('notificationTime');
            
            notificationText.textContent = notification.message || '';
            
            if (notification.createdAt) {
                const date = notification.createdAt.toDate ? 
                    notification.createdAt.toDate() : new Date(notification.createdAt);
                notificationTime.textContent = '📅 ' + date.toLocaleString('bn-BD');
            }
            
            notificationBox.classList.add('show');
        }

        // সেটিংস লোড করা
        async function loadSettings() {
            try {
                const settingsDoc = await db.collection('xr7_settings').doc('main').get();
                
                if (!settingsDoc.exists) {
                    throw new Error('সেটিংস পাওয়া যায়নি');
                }

                const data = settingsDoc.data();
                
                // সেলিং স্ট্যাটাস চেক
                if (data.selling_status !== 'open') {
                    throw new Error('সেলিং বর্তমানে বন্ধ আছে');
                }

                coinsData = data.coins || {};
                
                // ডিবাগ ইনফো আপডেট
                updateDebugInfo(data);
                
                // কয়েন ড্রপডাউন পপুলেট
                const select = document.getElementById('coinSelect');
                select.innerHTML = '<option value="">কয়েন নির্বাচন করুন</option>';
                
                let activeCoins = 0;
                for (const [coinName, coinData] of Object.entries(coinsData)) {
                    if (coinData.active) {
                        const option = document.createElement('option');
                        option.value = coinName;
                        option.textContent = `${coinName} - ৳${coinData.rate} (প্রতি ,০০০)`;
                        option.dataset.rate = coinData.rate;
                        select.appendChild(option);
                        activeCoins++;
                    }
                }

                if (activeCoins === 0) {
                    throw new Error('কোনো সক্রিয় কয়েন নেই');
                }

                // লোডিং লুকান, কন্টেন্ট দেখান
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');

                // ইভেন্ট লিসেনার
                select.addEventListener('change', updateTotal);
                document.getElementById('amount').addEventListener('input', updateTotal);
                document.getElementById('sellForm').addEventListener('submit', handleSubmit);
                
                // পেমেন্ট বাটন ইভেন্ট
                document.querySelectorAll('.payment-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.payment-btn').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        selectedPaymentMethod = this.dataset.method;
                        document.getElementById('paymentMethod').value = selectedPaymentMethod;
                    });
                });

            } catch (error) {
                throw error;
            }
        }

        // ডিবাগ ইনফো আপডেট
        function updateDebugInfo(data) {
            const coins = data.coins || {};
            let activeCoinsList = [];
            for (const [name, coin] of Object.entries(coins)) {
                if (coin.active) {
                    activeCoinsList.push(`${name}: ${coin.rate} টাকা`);
                }
            }
            
            const debugDiv = document.getElementById('debugInfo');
            debugDiv.innerHTML = `
                📌 স্ট্যাটাস: ${data.selling_status || 'closed'}<br>
                📌 কয়েন সংখ্যা: ${Object.keys(coins).length}<br>
                ✅ সক্রিয় কয়েন: ${activeCoinsList.join(' • ') || 'নেই'}
            `;
            debugDiv.style.display = 'block';
        }

        // টোটাল আপডেট
        function updateTotal() {
            const select = document.getElementById('coinSelect');
            const amount = document.getElementById('amount').value;
            
            if (select.value && amount) {
                const rate = parseFloat(select.options[select.selectedIndex].dataset.rate);
                const total = (amount / 1000) * rate;
                document.getElementById('totalAmount').textContent = total.toFixed(2);
                document.getElementById('coinAmount').textContent = parseInt(amount).toLocaleString('bn-BD');
                document.getElementById('rateDisplay').textContent = `৳${rate}`;
            }
        }

        // ফর্ম সাবমিট
        async function handleSubmit(e) {
            e.preventDefault();
            
            if (!selectedPaymentMethod) {
                alert('দয়া করে একটি পেমেন্ট মেথড নির্বাচন করুন!');
                return;
            }
            
            const coinName = document.getElementById('coinSelect').value;
            const amount = parseFloat(document.getElementById('amount').value;
            const accountNumber = document.getElementById('accountNumber').value;
            const couponCode = document.getElementById('couponCode').value;

            if (!coinName || !amount || !accountNumber) {
                alert('সব তথ্য পূরণ করুন!');
                return;
            }

            const rate = coinsData[coinName].rate;
            const totalPrice = (amount / 1000) * rate;

            // টেলিগ্রাম WebApp-কে ডেটা পাঠান
            const data = {
                coin_name: coinName,
                amount: amount,
                payment_method: selectedPaymentMethod,
                account_number: accountNumber,
                coupon_code: couponCode || '',
                total_price: totalPrice
            };

            // Telegram WebApp ডেটা পাঠানো
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.sendData(JSON.stringify(data));
                window.Telegram.WebApp.close();
            } else {
                alert('দয়া করে Telegram Mini App থেকে খুলুন!');
            }
        }

        // এরর দেখানো
        function showError(msg) {
            document.getElementById('loading').classList.add('hidden');
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = '❌ ' + msg;
            errorDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
