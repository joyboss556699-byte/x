<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XR7 Task - কয়েন সেল</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            color: #fff; 
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header { 
            background: rgba(255,255,255,0.1); 
            padding: 20px; 
            border-radius: 15px; 
            text-align: center;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .header h1 { color: #FFD700; font-size: 28px; margin-bottom: 10px; }
        .status { 
            display: inline-block; 
            padding: 8px 20px; 
            background: #2d5a2d; 
            border-radius: 20px; 
            font-size: 14px;
        }
        .status::before { 
            content: "●"; 
            color: #4CAF50; 
            margin-right: 5px; 
        }
        .debug-info {
            background: rgba(0,255,0,0.1);
            border-left: 3px solid #4CAF50;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 12px;
            font-family: monospace;
        }
        .form-group { 
            background: rgba(255,255,255,0.05); 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 15px;
        }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        select, input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 8px; 
            background: rgba(255,255,255,0.1); 
            color: #fff; 
            font-size: 16px;
        }
        select option { background: #2d2d44; color: #fff; }
        .payment-methods { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            margin: 15px 0;
        }
        .payment-btn { 
            padding: 12px; 
            border: 2px solid rgba(255,255,255,0.2); 
            border-radius: 8px; 
            background: rgba(255,255,255,0.1); 
            color: #fff; 
            cursor: pointer;
            transition: all 0.3s;
        }
        .payment-btn.active { 
            border-color: #FFD700; 
            background: rgba(255,215,0,0.2); 
            color: #FFD700;
        }
        .info-box { 
            background: rgba(255,193,7,0.1); 
            border-left: 4px solid #FFC107; 
            padding: 12px; 
            border-radius: 8px; 
            margin: 15px 0;
        }
        .rate-info { color: #FFD700; font-size: 18px; font-weight: bold; }
        .total-box { 
            background: linear-gradient(135deg, #4CAF50, #45a049); 
            padding: 20px; 
            border-radius: 12px; 
            text-align: center;
            margin: 20px 0;
        }
        .total-amount { font-size: 32px; font-weight: bold; }
        .submit-btn { 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(135deg, #2196F3, #1976D2); 
            border: none; 
            border-radius: 12px; 
            color: #fff; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled { 
            background: #555; 
            cursor: not-allowed; 
            transform: none;
        }
        .loading { 
            text-align: center; 
            padding: 40px; 
            color: #4CAF50;
        }
        .error { 
            background: rgba(244,67,54,0.2); 
            border-left: 4px solid #F44336; 
            padding: 15px; 
            border-radius: 8px; 
            margin: 15px 0;
            color: #ff6b6b;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>XR7 Task</h1>
            <p style="font-size: 20px; margin-bottom: 15px;">কয়েন সেল করুন</p>
            <div class="status">সেলিং চালু আছে</div>
        </div>

        <div id="loading" class="loading">
            <p>⏳ লোড হচ্ছে...</p>
        </div>

        <div id="error" class="error hidden"></div>

        <div id="debugInfo" class="debug-info hidden"></div>

        <div id="content" class="hidden">
            <form id="sellForm">
                <div class="form-group">
                    <label>কোন কয়েন বিক্রি করবেন</label>
                    <select id="coinSelect" required>
                        <option value="">কয়েন লিস্ট লোড হচ্ছে...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>পরিমাণ (কয়েন সংখ্যা)</label>
                    <input type="number" id="amount" placeholder="উদাহরণ: 1000" min="100" step="100" required>
                </div>

                <div class="form-group">
                    <label>পেমেন্ট মেথড</label>
                    <div class="payment-methods">
                        <button type="button" class="payment-btn" data-method="Bikas">Bikas</button>
                        <button type="button" class="payment-btn" data-method="Nogod">Nogod</button>
                        <button type="button" class="payment-btn" data-method="Rocket">Rocket</button>
                        <button type="button" class="payment-btn" data-method="Bank">Bank</button>
                    </div>
                    <input type="hidden" id="paymentMethod" required>
                </div>

                <div class="form-group">
                    <label>অ্যাকাউন্ট নাম্বার</label>
                    <input type="text" id="accountNumber" placeholder="বিকাশ/নগদ/রকেট/ব্যাংক নাম্বার" required>
                </div>

                <div class="form-group">
                    <label>কুপন / কোড</label>
                    <input type="text" id="couponCode" placeholder="ঐচ্ছিক">
                </div>

                <div class="info-box">
                    <div>রেট: <span id="rateDisplay" class="rate-info">—</span></div>
                </div>

                <div class="total-box">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span>পরিমাণ</span>
                        <span><span id="coinAmount">0</span> কয়েন</span>
                    </div>
                    <div style="font-size: 24px; font-weight: bold;">
                        মোট পাবেন <span style="float: right;"><span id="totalAmount">0.00</span> টাকা</span>
                    </div>
                </div>

                <button type="submit" class="submit-btn">সেল রিকোয়েস্ট পাঠান ✓</button>
            </form>
        </div>
    </div>

    <script>
        // Firebase কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyCz_5RfE2mMfW8YqJ3K9pN7xL4vT6sU8wQ",
            authDomain: "social-media-task-88c67.firebaseapp.com",
            projectId: "social-media-task-88c67",
            storageBucket: "social-media-task-88c67.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abc123"
        };

        // Firebase ইনিশিয়ালাইজ
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let coinsData = {};
        let selectedCoinRate = 0;
        let selectedPaymentMethod = '';

        // পেজ লোড হলে
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await loadSettings();
            } catch (error) {
                showError("ডেটা লোড করতে সমস্যা: " + error.message);
            }
        });

        // সেটিংস লোড করা
        async function loadSettings() {
            try {
                const settingsDoc = await db.collection('xr7_settings').doc('main').get();
                
                if (!settingsDoc.exists) {
                    throw new Error('সেটিংস পাওয়া যায়নি');
                }

                const data = settingsDoc.data();
                
                // সেলিং স্ট্যাটাস চেক
                if (data.selling_status !== 'open') {
                    throw new Error('সেলিং বর্তমানে বন্ধ আছে');
                }

                coinsData = data.coins || {};
                
                // ডিবাগ ইনফো আপডেট (Project ID ছাড়া)
                updateDebugInfo(data);
                
                // কয়েন ড্রপডাউন পপুলেট
                const select = document.getElementById('coinSelect');
                select.innerHTML = '<option value="">কয়েন নির্বাচন করুন</option>';
                
                let activeCoins = 0;
                for (const [coinName, coinData] of Object.entries(coinsData)) {
                    if (coinData.active) {
                        const option = document.createElement('option');
                        option.value = coinName;
                        option.textContent = `${coinName} - ${coinData.rate} টাকা (প্রতি ১০০)`;
                        option.dataset.rate = coinData.rate;
                        select.appendChild(option);
                        activeCoins++;
                    }
                }

                if (activeCoins === 0) {
                    throw new Error('কোনো সক্রিয় কয়েন নেই');
                }

                // লোডিং লুকান, কন্টেন্ট দেখান
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');

                // ইভেন্ট লিসেনার
                select.addEventListener('change', updateTotal);
                document.getElementById('amount').addEventListener('input', updateTotal);
                document.getElementById('sellForm').addEventListener('submit', handleSubmit);
                
                // পেমেন্ট বাটন ইভেন্ট
                document.querySelectorAll('.payment-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.payment-btn').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        selectedPaymentMethod = this.dataset.method;
                        document.getElementById('paymentMethod').value = selectedPaymentMethod;
                    });
                });

            } catch (error) {
                throw error;
            }
        }

        // ডিবাগ ইনফো আপডেট (Project ID ছাড়া)
        function updateDebugInfo(data) {
            const coins = data.coins || {};
            let activeCoinsList = [];
            for (const [name, coin] of Object.entries(coins)) {
                if (coin.active) {
                    activeCoinsList.push(`${name}: ${coin.rate} টাকা`);
                }
            }
            
            const debugDiv = document.getElementById('debugInfo');
            debugDiv.innerHTML = `
                📌 স্ট্যাটাস: ${data.selling_status || 'closed'}<br>
                📌 কয়েন সংখ্যা: ${Object.keys(coins).length}<br>
                ✅ সক্রিয় কয়েন: ${activeCoinsList.join(' • ') || 'নেই'}
            `;
            debugDiv.classList.remove('hidden');
        }

        // টোটাল আপডেট
        function updateTotal() {
            const select = document.getElementById('coinSelect');
            const amount = document.getElementById('amount').value;
            
            if (select.value && amount) {
                const rate = parseFloat(select.options[select.selectedIndex].dataset.rate);
                const total = (amount / 1000) * rate;
                document.getElementById('totalAmount').textContent = total.toFixed(2);
                document.getElementById('coinAmount').textContent = parseInt(amount).toLocaleString();
                document.getElementById('rateDisplay').textContent = `${rate} টাকা / ,০০০ কয়েন`;
            }
        }

        // ফর্ম সাবমিট
        async function handleSubmit(e) {
            e.preventDefault();
            
            if (!selectedPaymentMethod) {
                alert('দয়া করে একটি পেমেন্ট মেথড নির্বাচন করুন!');
                return;
            }
            
            const coinName = document.getElementById('coinSelect').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const accountNumber = document.getElementById('accountNumber').value;
            const couponCode = document.getElementById('couponCode').value;

            if (!coinName || !amount || !accountNumber) {
                alert('সব তথ্য পূরণ করুন!');
                return;
            }

            const rate = coinsData[coinName].rate;
            const totalPrice = (amount / 1000) * rate;

            // টেলিগ্রাম WebApp-কে ডেটা পাঠান
            const data = {
                coin_name: coinName,
                amount: amount,
                payment_method: selectedPaymentMethod,
                account_number: accountNumber,
                coupon_code: couponCode || '',
                total_price: totalPrice
            };

            // Telegram WebApp ডেটা পাঠানো
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.sendData(JSON.stringify(data));
                window.Telegram.WebApp.close();
            } else {
                alert('দয়া করে Telegram Mini App থেকে খুলুন!');
            }
        }

        // এরর দেখানো
        function showError(msg) {
            document.getElementById('loading').classList.add('hidden');
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = '❌ ' + msg;
            errorDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
