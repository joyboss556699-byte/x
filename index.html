<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XR7 PANEL - কয়েন সেল</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Noto Sans Bengali', 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #fff; 
            padding: 16px;
            min-height: 100vh;
        }
        
        .container { max-width: 600px; margin: 0 auto; }
        
        /* ========== নোটিশ বক্স ========== */
        .notification-box {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 50%, #c44569 100%);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(238, 90, 111, 0.4);
            animation: slideDown 0.5s ease, pulse 2s ease-in-out infinite;
            border: 2px solid rgba(255,255,255,0.3);
            display: none;
            position: relative;
            overflow: hidden;
        }
        .notification-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
        .notification-box.show { display: block; }
        .notification-box h3 { 
            font-size: 17px; 
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 1;
        }
        .notification-box p { 
            font-size: 14px; 
            line-height: 1.6; 
            position: relative;
            z-index: 1;
        }
        .notification-box .time { 
            font-size: 11px; 
            opacity: 0.9; 
            margin-top: 8px;
            display: block;
            position: relative;
            z-index: 1;
        }
        
        /* ========== হেডার ========== */
        .header { 
            background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,165,0,0.1));
            padding: 28px 20px; 
            border-radius: 20px; 
            text-align: center;
            margin-bottom: 20px;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255,215,0,0.3);
            box-shadow: 0 10px 40px rgba(255,215,0,0.15);
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '✨';
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 24px;
            animation: float 3s ease-in-out infinite;
        }
        .header::after {
            content: '✨';
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            animation: float 3s ease-in-out infinite 1.5s;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .header h1 { 
            color: #FFD700; 
            font-size: 32px; 
            margin-bottom: 8px;
            font-weight: 800;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
            animation: glow 2s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px rgba(255,215,0,0.5); }
            50% { text-shadow: 0 0 30px rgba(255,215,0,0.8), 0 0 40px rgba(255,165,0,0.4); }
        }
        .header .subtitle {
            font-size: 18px;
            color: #ddd;
            margin-bottom: 16px;
        }
        .status { 
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px; 
            background: linear-gradient(135deg, #00b894, #00cec9);
            border-radius: 30px; 
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(0,206,201,0.4);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 4px 20px rgba(0,206,201,0.4); }
            50% { transform: scale(1.05); box-shadow: 0 6px 30px rgba(0,206,201,0.6); }
        }
        .status::before { 
            content: "●"; 
            color: #fff; 
            font-size: 12px;
            animation: blink 1.5s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* ========== ফর্ম গ্রুপ (গ্লাস ইফেক্ট) ========== */
        .form-group { 
            background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
            padding: 24px 20px; 
            border-radius: 18px; 
            margin-bottom: 18px;
            backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255,255,255,0.15);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .form-group:hover {
            border-color: rgba(255,215,0,0.4);
            box-shadow: 0 8px 32px rgba(255,215,0,0.1);
        }
        .form-group label { 
            display: block; 
            margin-bottom: 12px; 
            font-weight: 700; 
            color: #FFD700;
            font-size: 15px;
            letter-spacing: 0.5px;
        }
        
        /* ========== সিলেক্ট ও ইনপুট ========== */
        select, input[type="text"], input[type="number"] { 
            width: 100%; 
            padding: 16px 18px; 
            border: 2px solid rgba(255,255,255,0.2); 
            border-radius: 14px; 
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            color: #fff; 
            font-size: 16px;
            font-family: 'Noto Sans Bengali', sans-serif;
            transition: all 0.3s ease;
        }
        select:focus, input:focus { 
            outline: none;
            border-color: #FFD700;
            background: rgba(255,255,255,0.15);
            box-shadow: 0 0 20px rgba(255,215,0,0.3);
        }
        select option { 
            background: #1a1a2e; 
            color: #fff; 
            padding: 10px;
        }
        input::placeholder {
            color: rgba(255,255,255,0.4);
        }
        
        /* ========== পেমেন্ট বাটন (রঙিন) ========== */
        .payment-methods { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            margin-top: 12px;
        }
        .payment-btn { 
            padding: 16px 12px; 
            border: 2.5px solid rgba(255,255,255,0.2); 
            border-radius: 14px; 
            color: #fff; 
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            font-size: 15px;
            font-family: 'Noto Sans Bengali', sans-serif;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .payment-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .payment-btn:hover::before {
            left: 100%;
        }
        
        /* বিকাশ - গোলাপি */
        .payment-btn[data-method="বিকাশ"] {
            background: linear-gradient(135deg, #e91e8c, #ff6b9d);
            border-color: #e91e8c;
            box-shadow: 0 4px 15px rgba(233,30,140,0.3);
        }
        .payment-btn[data-method="বিকাশ"].active {
            border-color: #FFD700;
            box-shadow: 0 6px 25px rgba(233,30,140,0.6), 0 0 0 3px rgba(255,215,0,0.3);
            transform: translateY(-3px) scale(1.02);
        }
        
        /* নগদ - কমলা */
        .payment-btn[data-method="নগদ"] {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border-color: #ff6b35;
            box-shadow: 0 4px 15px rgba(255,107,53,0.3);
        }
        .payment-btn[data-method="নগদ"].active {
            border-color: #FFD700;
            box-shadow: 0 6px 25px rgba(255,107,53,0.6), 0 0 0 3px rgba(255,215,0,0.3);
            transform: translateY(-3px) scale(1.02);
        }
        
        /* রকেট - বেগুনি */
        .payment-btn[data-method="রকেট"] {
            background: linear-gradient(135deg, #8e44ad, #a855f7);
            border-color: #8e44ad;
            box-shadow: 0 4px 15px rgba(142,68,173,0.3);
        }
        .payment-btn[data-method="রকেট"].active {
            border-color: #FFD700;
            box-shadow: 0 6px 25px rgba(142,68,173,0.6), 0 0 0 3px rgba(255,215,0,0.3);
            transform: translateY(-3px) scale(1.02);
        }
        
        /* ব্যাংক - নীল */
        .payment-btn[data-method="ব্যাংক"] {
            background: linear-gradient(135deg, #2196F3, #00bcd4);
            border-color: #2196F3;
            box-shadow: 0 4px 15px rgba(33,150,243,0.3);
        }
        .payment-btn[data-method="ব্যাংক"].active {
            border-color: #FFD700;
            box-shadow: 0 6px 25px rgba(33,150,243,0.6), 0 0 0 3px rgba(255,215,0,0.3);
            transform: translateY(-3px) scale(1.02);
        }
        
        /* ========== ইনফো বক্স ========== */
        .info-box { 
            background: linear-gradient(135deg, rgba(255,193,7,0.15), rgba(255,165,0,0.08)); 
            border-left: 4px solid #FFC107; 
            padding: 16px 20px; 
            border-radius: 14px; 
            margin: 18px 0;
            border: 1.5px solid rgba(255,193,7,0.3);
        }
        .rate-info { color: #FFD700; font-size: 22px; font-weight: 800; }
        
        /* ========== টোটাল বক্স ========== */
        .total-box { 
            background: linear-gradient(135deg, #00b894, #00cec9); 
            padding: 28px 24px; 
            border-radius: 18px; 
            text-align: center;
            margin: 24px 0;
            box-shadow: 0 10px 40px rgba(0,206,201,0.3);
            border: 2px solid rgba(255,255,255,0.2);
            position: relative;
            overflow: hidden;
        }
        .total-box::before {
            content: '💰';
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 30px;
            opacity: 0.3;
        }
        .total-label { font-size: 16px; margin-bottom: 8px; opacity: 0.95; font-weight: 600; }
        .total-amount { 
            font-size: 40px; 
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .coin-amount {
            font-size: 16px;
            margin-top: 8px;
            opacity: 0.9;
        }
        
        /* ========== সাবমিট বাটন ========== */
        .submit-btn { 
            width: 100%; 
            padding: 20px; 
            background: linear-gradient(135deg, #FFD700, #FFA500); 
            border: none; 
            border-radius: 16px; 
            color: #000; 
            font-size: 20px; 
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(255,215,0,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Noto Sans Bengali', sans-serif;
            position: relative;
            overflow: hidden;
        }
        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.6s;
        }
        .submit-btn:hover::before {
            left: 100%;
        }
        .submit-btn:hover { 
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(255,215,0,0.6);
        }
        .submit-btn:active { transform: translateY(-1px); }
        .submit-btn:disabled { 
            background: #555; 
            cursor: not-allowed; 
            transform: none;
            box-shadow: none;
        }
        
        /* ========== লোডিং ========== */
        .loading { 
            text-align: center; 
            padding: 60px 20px; 
            color: #FFD700;
        }
        .loading p { 
            font-size: 18px;
            animation: fadeInOut 1.5s ease-in-out infinite;
        }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        /* ========== এরর ========== */
        .error { 
            background: linear-gradient(135deg, rgba(244,67,54,0.2), rgba(244,67,54,0.1)); 
            border: 2px solid rgba(244,67,54,0.5); 
            padding: 20px; 
            border-radius: 14px; 
            margin: 20px 0;
            color: #ff6b6b;
            box-shadow: 0 5px 20px rgba(244,67,54,0.2);
        }
        
        /* ========== হিডেন ========== */
        .hidden { display: none; }
        
        /* ========== অ্যানিমেশন ========== */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ========== স্ক্রলবার ========== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: #FFD700; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- নোটিশ বক্স -->
        <div id="notificationBox" class="notification-box">
            <h3>📢 গুরুত্বপূর্ণ নোটিশ</h3>
            <p id="notificationText"></p>
            <span class="time" id="notificationTime"></span>
        </div>

        <!-- হেডার -->
        <div class="header">
            <h1>XR7 PANEL</h1>
            <p class="subtitle">কয়েন সেল করুন এবং আয় করুন</p>
            <div class="status">সেলিং চালু আছে</div>
        </div>

        <!-- লোডিং -->
        <div id="loading" class="loading">
            <p>⏳ লোড হচ্ছে...</p>
        </div>

        <!-- এরর -->
        <div id="error" class="error hidden"></div>

        <!-- মেইন কন্টেন্ট -->
        <div id="content" class="hidden">
            <form id="sellForm">
                <div class="form-group">
                    <label>🪙 কোন কয়েন বিক্রি করবেন?</label>
                    <select id="coinSelect" required>
                        <option value="">কয়েন নির্বাচন করুন</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>💰 পরিমাণ (কয়েন সংখ্যা)</label>
                    <input type="number" id="amount" placeholder="উদাহরণ: 1000" min="100" step="100" required>
                </div>

                <div class="form-group">
                    <label>💳 পেমেন্ট মেথড নির্বাচন করুন</label>
                    <div class="payment-methods">
                        <button type="button" class="payment-btn" data-method="বিকাশ">বিকাশ</button>
                        <button type="button" class="payment-btn" data-method="নগদ">নগদ</button>
                        <button type="button" class="payment-btn" data-method="রকেট">রকেট</button>
                        <button type="button" class="payment-btn" data-method="ব্যাংক">ব্যাংক</button>
                    </div>
                    <input type="hidden" id="paymentMethod" required>
                </div>

                <div class="form-group">
                    <label> অ্যাকাউন্ট নাম্বার</label>
                    <input type="text" id="accountNumber" placeholder="আপনার অ্যাকাউন্ট নাম্বার লিখুন" required>
                </div>

                <div class="form-group">
                    <label>️ কুপন / কোড (ঐচ্ছিক)</label>
                    <input type="text" id="couponCode" placeholder="কুপন কোড থাকলে লিখুন">
                </div>

                <div class="info-box">
                    <div>💵 রেট: <span id="rateDisplay" class="rate-info">—</span></div>
                    <small style="opacity: 0.9;">প্রতি ,০০০ কয়েন</small>
                </div>

                <div class="total-box">
                    <div class="total-label">💰 মোট পাবেন</div>
                    <div class="total-amount">৳ <span id="totalAmount">0.00</span></div>
                    <div class="coin-amount"><span id="coinAmount">0</span> কয়েন</div>
                </div>

                <button type="submit" class="submit-btn">
                    ✅ সেল রিকোয়েস্ট পাঠান
                </button>
            </form>
        </div>
    </div>

    <script>
        // Firebase কনফিগারেশন
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "xr7-task.firebaseapp.com",
            projectId: "xr7-task",
            storageBucket: "xr7-task.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abc123"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let coinsData = {};
        let selectedPaymentMethod = '';

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await Promise.all([
                    loadNotifications(),
                    loadSettings()
                ]);
            } catch (error) {
                showError("ডেটা লোড করতে সমস্যা: " + error.message);
            }
        });

        // নোটিশ লোড
        async function loadNotifications() {
            try {
                const notificationsRef = db.collection('xr7_notifications')
                    .where('active', '==', true)
                    .orderBy('createdAt', 'desc')
                    .limit(1);
                
                const snapshot = await notificationsRef.get();
                
                if (!snapshot.empty) {
                    const notification = snapshot.docs[0].data();
                    showNotification(notification);
                }
            } catch (error) {
                console.error('Notification Load Error:', error);
            }
        }

        function showNotification(notification) {
            const notificationBox = document.getElementById('notificationBox');
            const notificationText = document.getElementById('notificationText');
            const notificationTime = document.getElementById('notificationTime');
            
            notificationText.textContent = notification.message || '';
            
            if (notification.createdAt) {
                const date = notification.createdAt.toDate ? 
                    notification.createdAt.toDate() : new Date(notification.createdAt);
                notificationTime.textContent = '📅 ' + date.toLocaleString('bn-BD');
            }
            
            notificationBox.classList.add('show');
        }

        // সেটিংস লোড
        async function loadSettings() {
            try {
                const settingsDoc = await db.collection('xr7_settings').doc('main').get();
                
                if (!settingsDoc.exists) {
                    throw new Error('সেটিংস পাওয়া যায়নি');
                }

                const data = settingsDoc.data();
                
                if (data.selling_status !== 'open') {
                    throw new Error('সেলিং বর্তমানে বন্ধ আছে');
                }

                coinsData = data.coins || {};
                
                const select = document.getElementById('coinSelect');
                select.innerHTML = '<option value="">কয়েন নির্বাচন করুন</option>';
                
                let activeCoins = 0;
                for (const [coinName, coinData] of Object.entries(coinsData)) {
                    if (coinData.active) {
                        const option = document.createElement('option');
                        option.value = coinName;
                        option.textContent = `${coinName} - ৳${coinData.rate} (প্রতি ১,০০০)`;
                        option.dataset.rate = coinData.rate;
                        select.appendChild(option);
                        activeCoins++;
                    }
                }

                if (activeCoins === 0) {
                    throw new Error('কোনো সক্রিয় কয়েন নেই');
                }

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');

                select.addEventListener('change', updateTotal);
                document.getElementById('amount').addEventListener('input', updateTotal);
                document.getElementById('sellForm').addEventListener('submit', handleSubmit);
                
                document.querySelectorAll('.payment-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.payment-btn').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        selectedPaymentMethod = this.dataset.method;
                        document.getElementById('paymentMethod').value = selectedPaymentMethod;
                    });
                });

            } catch (error) {
                throw error;
            }
        }

        function updateTotal() {
            const select = document.getElementById('coinSelect');
            const amount = document.getElementById('amount').value;
            
            if (select.value && amount) {
                const rate = parseFloat(select.options[select.selectedIndex].dataset.rate);
                const total = (amount / 1000) * rate;
                document.getElementById('totalAmount').textContent = total.toFixed(2);
                document.getElementById('coinAmount').textContent = parseInt(amount).toLocaleString('bn-BD');
                document.getElementById('rateDisplay').textContent = `৳${rate}`;
            }
        }

        async function handleSubmit(e) {
            e.preventDefault();
            
            if (!selectedPaymentMethod) {
                alert('দয়া করে একটি পেমেন্ট মেথড নির্বাচন করুন!');
                return;
            }
            
            const coinName = document.getElementById('coinSelect').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const accountNumber = document.getElementById('accountNumber').value;
            const couponCode = document.getElementById('couponCode').value;

            if (!coinName || !amount || !accountNumber) {
                alert('সব তথ্য পূরণ করুন!');
                return;
            }

            const rate = coinsData[coinName].rate;
            const totalPrice = (amount / 1000) * rate;

            const data = {
                coin_name: coinName,
                amount: amount,
                payment_method: selectedPaymentMethod,
                account_number: accountNumber,
                coupon_code: couponCode || '',
                total_price: totalPrice
            };

            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.sendData(JSON.stringify(data));
                window.Telegram.WebApp.close();
            } else {
                alert('দয়া করে Telegram Mini App থেকে খুলুন!');
            }
        }

        function showError(msg) {
            document.getElementById('loading').classList.add('hidden');
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = '❌ ' + msg;
            errorDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
