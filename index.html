<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XR7 Task</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0e1116;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px;
        }
        .container { max-width: 500px; margin: 0 auto; }

        /* ===== হেডার ===== */
        .header {
            text-align: center;
            padding: 20px;
            background: #161b22;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid #2a323d;
        }
        
        /* ===== XR7 Task — লাইটিং + ফ্ল্যাশ ===== */
        .header h1 {
            color: #f0b429;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 2px;
            font-style: italic;
            text-shadow: 0 0 10px rgba(240, 180, 41, 0.3),
                         0 0 20px rgba(240, 180, 41, 0.2),
                         0 0 40px rgba(240, 180, 41, 0.1);
            animation: flashTitle 1.6s ease-in-out infinite;
        }
        .header h1 .sparkle {
            display: inline-block;
            font-style: normal;
            animation: sparkleSpin 1.6s ease-in-out infinite;
        }
        @keyframes sparkleSpin {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.3) rotate(20deg); }
        }

        @keyframes flashTitle {
            0% { 
                text-shadow: 0 0 6px rgba(240, 180, 41, 0.2),
                             0 0 12px rgba(240, 180, 41, 0.1),
                             0 0 20px rgba(240, 180, 41, 0.05);
                opacity: 0.7;
            }
            25% {
                text-shadow: 0 0 25px rgba(240, 180, 41, 0.8),
                             0 0 50px rgba(240, 180, 41, 0.6),
                             0 0 90px rgba(240, 180, 41, 0.35);
                opacity: 1;
            }
            50% { 
                text-shadow: 0 0 8px rgba(240, 180, 41, 0.25),
                             0 0 16px rgba(240, 180, 41, 0.15),
                             0 0 30px rgba(240, 180, 41, 0.08);
                opacity: 0.8;
            }
            75% {
                text-shadow: 0 0 30px rgba(240, 180, 41, 0.9),
                             0 0 60px rgba(240, 180, 41, 0.7),
                             0 0 100px rgba(240, 180, 41, 0.4);
                opacity: 1;
            }
            100% { 
                text-shadow: 0 0 6px rgba(240, 180, 41, 0.2),
                             0 0 12px rgba(240, 180, 41, 0.1),
                             0 0 20px rgba(240, 180, 41, 0.05);
                opacity: 0.7;
            }
        }

        .header .subtitle { color: #ffffff; font-size: 14px; margin-top: 5px; }
        
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(63,185,80,0.15);
            border-radius: 20px;
            font-size: 13px;
            color: #3fb950;
            margin-top: 10px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #3fb950;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* ===== কার্ড ===== */
        .card {
            background: #161b22;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #2a323d;
        }
        
        /* ===== লেবেল — White ===== */
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #ffffff;
            font-weight: 600;
        }
        label .required {
            color: #e5534b;
            margin-left: 4px;
        }
        
        select, input {
            width: 100%;
            padding: 14px;
            border: 1.5px solid #2a323d;
            border-radius: 12px;
            background: #0e1116;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }
        select:focus, input:focus { border-color: #f0b429; }
        select option { background: #0e1116; color: #ffffff; }
        input[type="file"] {
            padding: 10px;
            color: #ffffff;
            font-size: 13px;
        }
        input[type="file"]::-webkit-file-upload-button {
            background: #4169e1;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            margin-right: 10px;
            cursor: pointer;
            font-weight: 600;
        }
        /* ===== কয়েন বাটন — Deep Red + লাইটিং ===== */
        .coin-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .coin-btn {
            position: relative;
            padding: 14px 14px 14px 18px;
            border: 1.5px solid #8b0000;
            border-left-width: 5px;
            border-left-color: #ff3b3b;
            border-radius: 12px;
            background: linear-gradient(135deg, #6b0000, #3d0000);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.25s;
            animation: coinBtnGlow 2s ease-in-out infinite;
        }
        @keyframes coinBtnGlow {
            0% {
                box-shadow: 0 0 4px rgba(255, 0, 0, 0.25),
                            0 0 10px rgba(255, 0, 0, 0.15);
            }
            50% {
                box-shadow: 0 0 16px rgba(255, 30, 30, 0.85),
                            0 0 34px rgba(255, 30, 30, 0.5);
            }
            100% {
                box-shadow: 0 0 4px rgba(255, 0, 0, 0.25),
                            0 0 10px rgba(255, 0, 0, 0.15);
            }
        }
        .coin-btn .coin-rate {
            display: block;
            font-weight: 400;
            font-size: 12px;
            color: #ffffff;
            opacity: 0.85;
            margin-top: 3px;
        }
        .coin-btn.active {
            background: linear-gradient(135deg, #b71c1c, #7a0000);
            border-color: #ff5252;
            border-left-color: #f0b429;
        }
        .coin-btn.active::after {
            content: "✓";
            position: absolute;
            top: 10px;
            right: 12px;
            font-weight: 800;
            color: #f0b429;
        }

        /* ===== পেমেন্ট বাটন — Medium Blue ===== */
        .payment-methods {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .payment-btn {
            padding: 14px;
            border: 1.5px solid #4169e1;
            border-radius: 12px;
            background: #4169e1;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        .payment-btn.active {
            border-color: #f0b429;
            background: #3157c4;
            box-shadow: 0 8px 28px rgba(65, 105, 225, 0.5);
            color: #ffffff;
        }

        /* ===== সামারি — Deep Yellow বক্স + লাইটিং ফ্ল্যাশ ===== */
        .summary {
            background: linear-gradient(135deg, #c99700, #7a5c00);
            padding: 16px;
            border-radius: 12px;
            margin-top: 16px;
            border: 1px solid #4d3a00;
            animation: summaryGlow 1.8s ease-in-out infinite;
        }
        @keyframes summaryGlow {
            0% {
                box-shadow: 0 0 6px rgba(240, 180, 41, 0.3),
                            0 0 14px rgba(240, 180, 41, 0.2);
            }
            50% {
                box-shadow: 0 0 26px rgba(240, 180, 41, 1),
                            0 0 55px rgba(240, 180, 41, 0.65),
                            0 0 90px rgba(240, 180, 41, 0.4);
            }
            100% {
                box-shadow: 0 0 6px rgba(240, 180, 41, 0.3),
                            0 0 14px rgba(240, 180, 41, 0.2);
            }
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 14px;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.35);
        }
        .summary-row.total {
            border-top: 1px solid rgba(0,0,0,0.25);
            margin-top: 8px;
            padding-top: 12px;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.35);
        }
        
        /* ===== মোট পাবেন — উজ্জ্বল হলুদ (ইউজারের দেওয়া exact কালার #ffff00) ===== */
        .summary-row.total .total-amount {
            color: #ffff00;
            text-shadow: none;
        }

        /* ===== সাবমিট বাটন ===== */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #f0b429;
            color: #1a1400;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 16px;
        }
        .submit-btn:disabled {
            background: #3a3a2e;
            color: #6b6b5a;
            cursor: not-allowed;
        }

        .error {
            background: rgba(229,83,75,0.1);
            border: 1px solid #e5534b;
            color: #e5534b;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            text-align: center;
        }
        .success {
            background: rgba(63,185,80,0.1);
            border: 1px solid #3fb950;
            color: #3fb950;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #ffffff;
        }
        .spinner {
            border: 3px solid #2a323d;
            border-top: 3px solid #f0b429;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        
        .note-box {
            background: rgba(240,180,41,0.08);
            border: 1px solid #7a5c15;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
            color: #f0b429;
            margin-bottom: 16px;
            display: none;
            line-height: 1.5;
        }

        /* ===== ইউজারনেম কপি বাটন ===== */
        .copy-btn {
            display: none;
            width: 100%;
            padding: 12px;
            margin: 10px 0 16px;
            border: 1.5px dashed #f0b429;
            border-radius: 10px;
            background: rgba(240,180,41,0.08);
            color: #f0b429;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .copy-btn:active {
            transform: scale(0.98);
            background: rgba(240,180,41,0.18);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span class="sparkle">✨</span> XR7 Task <span class="sparkle">✨</span></h1>
            <div class="subtitle">কয়েন সেল করুন • সহজে • দ্রুত</div>
            <div style="margin-top: 12px;">
                <div class="status">
                    <div class="status-dot"></div>
                    <span id="statusText">লোড হচ্ছে...</span>
                </div>
            </div>
        </div>

        <div id="messageArea"></div>
        <div id="noteBox" class="note-box"></div>

        <div id="loadingArea" class="loading">
            <div class="spinner"></div>
            <p>ডেটা লোড হচ্ছে...</p>
        </div>

        <div id="formArea" class="hidden">
            <div class="card">
                <div class="form-group">
                    <label>কোন কয়েন বিক্রি করবেন?</label>
                    <div class="coin-buttons" id="coinButtons"></div>
                </div>

                <div id="copyUsernameBtn" class="copy-btn">📋 ইউজারনেম কপি করুন</div>

                <!-- ইউজারনেম ফিল্ড -->
                <div class="form-group" id="usernameGroup" style="display: none;">
                    <label>Instagram ইউজারনেম <span class="required">*</span></label>
                    <input type="text" id="usernameInput" placeholder="আপনার Instagram ইউজারনেম লিখুন">
                    <small style="color: #ffffff; font-size: 12px; display: block; margin-top: 4px;">📌 Niva Coin সেল করতে আপনার Instagram ইউজারনেম দিন</small>
                </div>

                <div class="form-group">
                    <label>পরিমাণ (কয়েন সংখ্যা)</label>
                    <input type="number" id="amountInput" placeholder="যেমন: 1000" min="1" value="1000">
                </div>

                <div class="form-group">
                    <label>পেমেন্ট মেথড</label>
                    <div class="payment-methods" id="paymentMethods"></div>
                </div>

                <div class="form-group">
                    <label>অ্যাকাউন্ট নাম্বার</label>
                    <input type="text" id="accountNumber" placeholder="বিকাশ/নগদ/রকেট/ব্যাংক নাম্বার">
                </div>

                <!-- কুপন কোড ফিল্ড -->
                <div class="form-group" id="couponGroup" style="display: none;">
                    <label>কুপন / কোড <span class="required">*</span></label>
                    <input type="text" id="couponCode" placeholder="আপনার কুপন কোড লিখুন">
                    <small style="color: #ffffff; font-size: 12px; display: block; margin-top: 4px;">🎟️ TOP Follow Coin সেল করতে আপনার কুপন কোড দিন</small>
                </div>

                <!-- স্ক্রিনশট আপলোড ফিল্ড -->
                <div class="form-group" id="screenshotGroup" style="display: none;">
                    <label>স্ক্রিনশট আপলোড করুন <span class="required">*</span></label>
                    <input type="file" id="screenshotInput" accept="image/*">
                    <img id="screenshotPreview" style="display:none; max-width: 100%; border-radius: 12px; margin-top: 10px; border: 1.5px solid #2a323d;">
                    <small style="color: #ffffff; font-size: 12px; display: block; margin-top: 4px;">📎 প্রমাণ হিসেবে স্ক্রিনশট আপলোড করুন</small>
                </div>

                <div class="summary">
                    <div class="summary-row">
                        <span>রেট</span>
                        <span id="rateDisplay">—</span>
                    </div>
                    <div class="summary-row">
                        <span>পরিমাণ</span>
                        <span id="amountDisplay">0 কয়েন</span>
                    </div>
                    <div class="summary-row total">
                        <span>মোট পাবেন</span>
                        <span class="total-amount" id="totalAmount">0.00 টাকা</span>
                    </div>
                </div>
            </div>

            <button class="submit-btn" id="submitBtn" disabled>সেল রিকোয়েস্ট পাঠান</button>
        </div>
    </div>

    <script>
        // ==================== Firebase Config ====================
        const firebaseConfig = {
            apiKey: "AIzaSyBvZ8H5K9qJxYqKxYqKxYqKxYqKxYqKxYq",
            authDomain: "social-media-task-88c67.firebaseapp.com",
            projectId: "social-media-task-88c67",
            storageBucket: "social-media-task-88c67.firebasestorage.app",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abc123"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const tg = window.Telegram.WebApp;
        tg.expand();

        let COINS = {};
        let PAYMENT_METHODS = [];
        let sellingStatus = 'closed';
        let selectedCoinName = null;
        let selectedMethod = null;

        // ==================== কয়েন অনুযায়ী কালার (যেকোনো নতুন কয়েনের জন্যও কাজ করবে) ====================
        const COIN_COLOR_PALETTE = ['#4a7dff', '#e8871e', '#16a085', '#29b6f6', '#e84393', '#8e44ad', '#2ecc71', '#f39c12'];
        function getCoinColor(name) {
            const n = (name || '').trim();
            if (!n) return '#f0b429';
            let hash = 0;
            for (let i = 0; i < n.length; i++) {
                hash = (hash * 31 + n.charCodeAt(i)) >>> 0;
            }
            return COIN_COLOR_PALETTE[hash % COIN_COLOR_PALETTE.length];
        }
        function applyCoinColor() {
            // এখন প্রতিটি কয়েন বাটনের নিজস্ব কালার renderCoins() এ সেট হয়
        }

        const coinButtons = document.getElementById('coinButtons');
        const paymentMethodsDiv = document.getElementById('paymentMethods');
        const amountInput = document.getElementById('amountInput');
        const accountInput = document.getElementById('accountNumber');
        const usernameGroup = document.getElementById('usernameGroup');
        const usernameInput = document.getElementById('usernameInput');
        const couponGroup = document.getElementById('couponGroup');
        const couponInput = document.getElementById('couponCode');
        const screenshotGroup = document.getElementById('screenshotGroup');
        const screenshotInput = document.getElementById('screenshotInput');
        const screenshotPreview = document.getElementById('screenshotPreview');
        let screenshotData = null;
        const submitBtn = document.getElementById('submitBtn');
        const statusText = document.getElementById('statusText');
        const loadingArea = document.getElementById('loadingArea');
        const formArea = document.getElementById('formArea');
        const noteBox = document.getElementById('noteBox');
        const copyUsernameBtn = document.getElementById('copyUsernameBtn');

        // ==================== রেন্ডার ====================
        // স্ক্রিনশট আপলোড
        screenshotInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    screenshotData = event.target.result; // Base64
                    screenshotPreview.src = screenshotData;
                    screenshotPreview.style.display = 'block';
                    validateForm();
                };
                reader.readAsDataURL(file);
            } else {
                screenshotData = null;
                screenshotPreview.style.display = 'none';
                validateForm();
            }
        });

        function renderStatus() {
            if (sellingStatus === 'open') {
                statusText.textContent = 'সেলিং চালু আছে';
            } else {
                statusText.textContent = 'সেলিং বন্ধ';
            }
            validateForm();
        }

        function renderCoins() {
            const activeCoins = Object.entries(COINS).filter(([_, c]) => c && c.active !== false);
            
            coinButtons.innerHTML = '';
            
            if (activeCoins.length === 0) {
                coinButtons.innerHTML = '<div style="color:#ffffff; opacity:0.7; grid-column: 1 / -1;">কোনো কয়েন নেই</div>';
                selectedCoinName = null;
                updateSummary();
                return;
            }

            if (!selectedCoinName || !COINS[selectedCoinName] || COINS[selectedCoinName].active === false) {
                selectedCoinName = activeCoins[0][0];
            }

            activeCoins.forEach(([name, coin]) => {
                const rate = coin.rate || 0;
                const requiresUsername = coin.requires_username || false;
                const requiresCoupon = coin.requires_coupon_code || false;
                const requiresScreenshot = coin.requires_screenshot || false;

                const btn = document.createElement('div');
                btn.className = 'coin-btn' + (name === selectedCoinName ? ' active' : '');
                // এখন সব বাটন uniform deep red (CSS থেকে), তাই আলাদা কালার সেট করা হচ্ছে না

                let icons = '';
                if (requiresUsername) icons += ' 📸';
                if (requiresCoupon) icons += ' 🎟️';
                if (requiresScreenshot) icons += ' 📎';

                btn.innerHTML = `${name}${icons}<span class="coin-rate">${rate} টাকা (প্রতি ১০০০)</span>`;
                btn.dataset.name = name;

                btn.addEventListener('click', () => {
                    selectedCoinName = name;
                    renderCoins();
                    updateSummary();
                    showCoinNote();
                });

                coinButtons.appendChild(btn);
            });

            updateSummary();
            showCoinNote();
        }

        function extractCopyValue(note) {
            // "username: patgivq তে পাঠান" এর মতো টেক্সট থেকে শুধু username/কোডটুকু বের করার চেষ্টা করে
            const m = note.match(/username[:\s]*([^\s,।]+)/i);
            return m ? m[1] : note;
        }

        function showCoinNote() {
            const coin = currentCoin();
            if (coin) {
                const note = coin.admin_note || '';
                if (note) {
                    noteBox.textContent = '📌 ' + note;
                    noteBox.style.display = 'block';

                    copyUsernameBtn.style.display = 'block';
                    copyUsernameBtn.textContent = '📋 ইউজারনেম কপি করুন';
                    copyUsernameBtn.onclick = function() {
                        const value = extractCopyValue(note);
                        navigator.clipboard.writeText(value).then(() => {
                            const original = copyUsernameBtn.textContent;
                            copyUsernameBtn.textContent = '✅ কপি হয়েছে!';
                            setTimeout(() => { copyUsernameBtn.textContent = original; }, 1500);
                        }).catch(() => {});
                    };
                } else {
                    noteBox.style.display = 'none';
                    copyUsernameBtn.style.display = 'none';
                }
            } else {
                noteBox.style.display = 'none';
                copyUsernameBtn.style.display = 'none';
            }
        }

        function renderMethods() {
            const methods = PAYMENT_METHODS.length ? PAYMENT_METHODS : ["বিকাশ", "নগদ", "রকেট", "ব্যাংক"];
            if (!selectedMethod || !methods.includes(selectedMethod)) {
                selectedMethod = methods[0];
            }
            
            paymentMethodsDiv.innerHTML = '';
            methods.forEach((method) => {
                const btn = document.createElement('div');
                btn.className = 'payment-btn' + (method === selectedMethod ? ' active' : '');
                btn.textContent = method;
                btn.dataset.method = method;
                btn.addEventListener('click', () => {
                    selectedMethod = method;
                    renderMethods();
                    validateForm();
                });
                paymentMethodsDiv.appendChild(btn);
            });
        }

        function currentCoin() {
            return selectedCoinName ? COINS[selectedCoinName] : null;
        }

        function updateSummary() {
            const coin = currentCoin();
            const amount = parseInt(amountInput.value || '0', 10);
            const rate = coin ? (coin.rate || 0) : 0;
            const total = (amount / 1000) * rate;

            document.getElementById('rateDisplay').textContent = coin ? (rate + ' টাকা / ১,০০০ কয়েন') : '—';
            document.getElementById('amountDisplay').textContent = amount.toLocaleString('en-US') + ' কয়েন';
            document.getElementById('totalAmount').textContent = total.toFixed(2) + ' টাকা';

            if (coin) {
                const requiresUsername = coin.requires_username || false;
                const requiresCoupon = coin.requires_coupon_code || false;
                const requiresScreenshot = coin.requires_screenshot || false;
                
                usernameGroup.style.display = requiresUsername ? 'block' : 'none';
                couponGroup.style.display = requiresCoupon ? 'block' : 'none';
                screenshotGroup.style.display = requiresScreenshot ? 'block' : 'none';
                
                if (!requiresUsername) usernameInput.value = '';
                if (!requiresCoupon) couponInput.value = '';
                if (!requiresScreenshot) {
                    screenshotData = null;
                    screenshotInput.value = '';
                    screenshotPreview.style.display = 'none';
                }
            } else {
                usernameGroup.style.display = 'none';
                couponGroup.style.display = 'none';
                screenshotGroup.style.display = 'none';
            }

            validateForm();
        }

        function validateForm() {
            const coin = currentCoin();
            const amount = parseInt(amountInput.value || '0', 10);
            const account = accountInput.value.trim();
            
            const requiresUsername = coin && coin.requires_username;
            const usernameOk = !requiresUsername || usernameInput.value.trim().length > 0;
            
            const requiresCoupon = coin && coin.requires_coupon_code;
            const couponOk = !requiresCoupon || couponInput.value.trim().length > 0;

            const requiresScreenshot = coin && coin.requires_screenshot;
            const screenshotOk = !requiresScreenshot || !!screenshotData;

            const amountOk = amount > 0;
            const accountOk = account.length >= 6;

            const formValid = sellingStatus === 'open' && !!coin && amountOk && accountOk && !!selectedMethod && usernameOk && couponOk && screenshotOk;
            submitBtn.disabled = !formValid;
        }

        amountInput.addEventListener('input', updateSummary);
        accountInput.addEventListener('input', validateForm);
        usernameInput.addEventListener('input', validateForm);
        couponInput.addEventListener('input', validateForm);

        submitBtn.addEventListener('click', () => {
            const coin = currentCoin();
            if (!coin || !selectedCoinName) return;

            const amount = parseInt(amountInput.value || '0', 10);
            const account = accountInput.value.trim();
            const total = (amount / 1000) * (coin.rate || 0);
            
            const requiresUsername = coin.requires_username || false;
            const requiresCoupon = coin.requires_coupon_code || false;
            const requiresScreenshot = coin.requires_screenshot || false;

            const payload = {
                action: "xr7_sell_request",
                coin_name: selectedCoinName,
                amount: amount,
                payment_method: selectedMethod,
                account_number: account,
                estimated_total: Number(total.toFixed(2))
            };

            if (requiresUsername) {
                payload.username = usernameInput.value.trim();
            }

            if (requiresCoupon) {
                payload.coupon_code = couponInput.value.trim();
            }

            if (requiresScreenshot && screenshotData) {
                payload.screenshot = screenshotData;
            }

            tg.sendData(JSON.stringify(payload));

            document.getElementById('formArea').classList.add('hidden');
            document.getElementById('loadingArea').classList.remove('hidden');
            document.querySelector('#loadingArea p').textContent = '✅ রিকোয়েস্ট পাঠানো হয়েছে!';

            setTimeout(() => tg.close(), 2000);
        });

        async function loadData() {
            try {
                const doc = await db.collection('xr7_settings').doc('main').get();

                if (!doc.exists) {
                    statusText.textContent = 'সেটিংস নেই';
                    return;
                }

                const data = doc.data();
                COINS = data.coins || {};
                PAYMENT_METHODS = data.payment_methods || [];
                sellingStatus = data.selling_status || 'closed';

                renderStatus();
                renderCoins();
                renderMethods();

                loadingArea.classList.add('hidden');
                formArea.classList.remove('hidden');

            } catch (error) {
                console.error('Load error:', error);
                statusText.textContent = 'ডেটা লোড হয়নি';
            }
        }

        window.addEventListener('load', loadData);
    </script>
</body>
</html>
