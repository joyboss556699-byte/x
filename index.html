<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XR7 Coin Sell</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            font-size: 24px;
            color: #ffd700;
            margin-bottom: 10px;
        }
        
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 20px;
            font-size: 14px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .debug-info {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #00ff00;
            overflow-x: auto;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #e0e0e0;
            font-size: 14px;
        }
        
        select, input {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
            -webkit-appearance: none;
            appearance: none;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #ffd700;
            background: rgba(255, 255, 255, 0.1);
        }
        
        select option {
            background: #1a1a2e;
            color: #fff;
        }
        
        .payment-methods {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        
        .payment-btn {
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .payment-btn.active {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #1a1a2e;
            border-color: #ffd700;
        }
        
        .summary {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .summary-row.total {
            border-top: 2px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        
        .total-amount {
            color: #ffd700;
        }
        
        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #1a1a2e;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 460px;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
        }
        
        .submit-btn:hover {
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.4);
        }
        
        .submit-btn:active {
            transform: translateX(-50%) translateY(0);
        }
        
        .submit-btn:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff6b6b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: #6bff6b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #ffd700;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .no-coins {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>XR7 PANEL</h1>
            <h2 style="font-size: 20px; margin-bottom: 15px;">কয়েন সেল করুন</h2>
            <div class="status">
                <div class="status-dot"></div>
                <span>সেলিং চালু আছে</span>
            </div>
        </div>

        <div id="debugInfo" class="debug-info" style="display: none;">
            লোড হচ্ছে...
        </div>

        <div id="messageArea"></div>

        <div id="loadingArea" class="loading">
            <div class="spinner"></div>
            <p>ডিবাগ তথ্য লোড হচ্ছে...</p>
        </div>

        <div id="formArea" style="display: none;">
            <div class="card">
                <div class="form-group">
                    <label>কোন কয়েন বিক্রি করবেন</label>
                    <select id="coinSelect" required>
                        <option value="">কয়েন লিস্ট লোড হচ্ছে...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>পরিমাণ (কয়েন সংখ্যা)</label>
                    <input type="number" id="amountInput" placeholder="যেমন: 1000" min="1" value="1000">
                </div>

                <div class="form-group">
                    <label>পেমেন্ট মেথড</label>
                    <div class="payment-methods" id="paymentMethods">
                        <div class="payment-btn active" data-method="Bikash">বিকাশ</div>
                        <div class="payment-btn" data-method="Nogod">নগদ</div>
                        <div class="payment-btn" data-method="Rocat">রকেট</div>
                        <div class="payment-btn" data-method="Bank">ব্যাংক</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>অ্যাকাউন্ট নাম্বার</label>
                    <input type="text" id="accountNumber" placeholder="বিকাশ/নগদ/রকেট/ব্যাংক নাম্বার">
                </div>

                <div class="form-group" id="couponGroup" style="display: none;">
                    <label>কুপন / কোড</label>
                    <input type="text" id="couponCode" placeholder="কুপন/কোড দিন">
                </div>

                <div class="summary">
                    <div class="summary-row">
                        <span>রেট</span>
                        <span id="rateDisplay">—</span>
                    </div>
                    <div class="summary-row">
                        <span>পরিমাণ</span>
                        <span id="amountDisplay">0 কয়েন</span>
                    </div>
                    <div class="summary-row total">
                        <span>মোট পাবেন</span>
                        <span class="total-amount" id="totalAmount">0.00 টাকা</span>
                    </div>
                </div>
            </div>

            <button class="submit-btn" id="submitBtn" onclick="submitSale()">
                সেল রিকোয়েস্ট পাঠান ✓
            </button>
        </div>
    </div>

    <script>
        // ✅ সঠিক Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA7iEsZI2wlTd-a_34AbJswK602Cjkd7i",
            authDomain: "xr7-task.firebaseapp.com",
            projectId: "xr7-task",
            storageBucket: "xr7-task.firebasestorage.app",
            messagingSenderId: "934803666532",
            appId: "1:934803666532:web:c8699df5227cdf4719"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        // State
        let coinsData = {};
        let selectedCoin = null;
        let selectedPaymentMethod = 'Bikash';
        let currentRate = 0;

        // Payment method buttons
        document.querySelectorAll('.payment-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.payment-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedPaymentMethod = this.dataset.method;
            });
        });

        // Load coins from Firebase
        async function loadCoins() {
            try {
                const debugDiv = document.getElementById('debugInfo');
                debugDiv.style.display = 'block';
                debugDiv.innerHTML = '🔄 Firebase থেকে ডেটা লোড হচ্ছে...';

                const settingsDoc = await db.collection('xr7_settings').doc('main').get();
                
                if (!settingsDoc.exists) {
                    throw new Error('সেটিংস ডকুমেন্ট পাওয়া যায়নি!');
                }

                const settings = settingsDoc.data();
                coinsData = settings.coins || {};
                
                // Debug info
                let debugText = `প্রজেক্ট: xr7-task\n`;
                debugText += `ডকুমেন্ট পাথ: xr7_settings/main\n`;
                debugText += `selling_status: "${settings.selling_status || 'closed'}"\n`;
                debugText += `coins ফিল্ড টাইপ: ${typeof coinsData}\n`;
                debugText += `coins এর সংখ্যা: ${Object.keys(coinsData).length}\n`;
                debugText += `coins raw: ${JSON.stringify(coinsData)}\n\n`;
                
                if (Object.keys(coinsData).length > 0) {
                    debugText += `সক্রিয় কয়েন:\n`;
                    for (const [coinName, coinData] of Object.entries(coinsData)) {
                        if (coinData.active) {
                            debugText += `  • ${coinName}: ${coinData.rate} টাকা\n`;
                        }
                    }
                }

                debugDiv.innerHTML = debugText;

                // Check selling status
                if (settings.selling_status !== 'open') {
                    throw new Error('সেলিং বর্তমানে বন্ধ আছে!');
                }

                // Filter active coins
                const activeCoins = Object.entries(coinsData)
                    .filter(([_, data]) => data.active)
                    .sort((a, b) => a[0].localeCompare(b[0]));

                if (activeCoins.length === 0) {
                    throw new Error('কোনো সক্রিয় কয়েন নেই!');
                }

                // Populate dropdown
                const coinSelect = document.getElementById('coinSelect');
                coinSelect.innerHTML = '<option value="">কয়েন সিলেক্ট করুন</option>';
                
                activeCoins.forEach(([coinName, coinData]) => {
                    const option = document.createElement('option');
                    option.value = coinName;
                    option.textContent = `${coinName} - ${coinData.rate} টাকা (প্রতি ১০০০)`;
                    option.dataset.rate = coinData.rate;
                    option.dataset.requiresCoupon = coinData.requires_coupon_code || false;
                    coinSelect.appendChild(option);
                });

                // Hide loading, show form
                document.getElementById('loadingArea').style.display = 'none';
                document.getElementById('formArea').style.display = 'block';

                // Set default coin
                if (activeCoins.length > 0) {
                    coinSelect.value = activeCoins[0][0];
                    updateCalculation();
                }

            } catch (error) {
                console.error('Error loading coins:', error);
                document.getElementById('loadingArea').style.display = 'none';
                showMessage('error', `❌ সমস্যা: ${error.message}`);
            }
        }

        // Update calculation
        function updateCalculation() {
            const coinSelect = document.getElementById('coinSelect');
            const amountInput = document.getElementById('amountInput');
            const selectedOption = coinSelect.options[coinSelect.selectedIndex];
            
            if (!selectedOption.value) {
                return;
            }

            currentRate = parseFloat(selectedOption.dataset.rate) || 0;
            const amount = parseInt(amountInput.value) || 0;
            const requiresCoupon = selectedOption.dataset.requiresCoupon === 'true';

            // Show/hide coupon field
            document.getElementById('couponGroup').style.display = requiresCoupon ? 'block' : 'none';

            // Calculate total
            const total = (amount / 1000) * currentRate;

            // Update display
            document.getElementById('rateDisplay').textContent = `${currentRate} টাকা`;
            document.getElementById('amountDisplay').textContent = `${amount.toLocaleString()} কয়েন`;
            document.getElementById('totalAmount').textContent = `${total.toFixed(2)} টাকা`;
        }

        // Show message
        function showMessage(type, text) {
            const msgArea = document.getElementById('messageArea');
            msgArea.innerHTML = `<div class="${type}">${text}</div>`;
            setTimeout(() => {
                msgArea.innerHTML = '';
            }, 5000);
        }

        // Submit sale
        async function submitSale() {
            const coinSelect = document.getElementById('coinSelect');
            const amountInput = document.getElementById('amountInput');
            const accountNumber = document.getElementById('accountNumber').value.trim();
            const couponCode = document.getElementById('couponCode').value.trim();
            const submitBtn = document.getElementById('submitBtn');

            // Validation
            if (!coinSelect.value) {
                showMessage('error', '❌ দয়া করে কয়েন সিলেক্ট করুন!');
                return;
            }

            const amount = parseInt(amountInput.value);
            if (!amount || amount <= 0) {
                showMessage('error', '❌ সঠিক পরিমাণ দিন!');
                return;
            }

            if (!accountNumber) {
                showMessage('error', '❌ অ্যাকাউন্ট নাম্বার দিন!');
                return;
            }

            const selectedOption = coinSelect.options[coinSelect.selectedIndex];
            const requiresCoupon = selectedOption.dataset.requiresCoupon === 'true';
            
            if (requiresCoupon && !couponCode) {
                showMessage('error', '❌ কুপন কোড দিন!');
                return;
            }

            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'পাঠানো হচ্ছে...';

            try {
                const payload = {
                    coin_name: coinSelect.value,
                    amount: amount,
                    payment_method: selectedPaymentMethod,
                    account_number: accountNumber,
                    username: tg.initDataUnsafe.user?.username || '',
                    coupon_code: requiresCoupon ? couponCode : null
                };

                // Send data to Telegram bot
                tg.sendData(JSON.stringify(payload));

                // Show success
                showMessage('success', '✅ রিকোয়েস্ট পাঠানো হয়েছে!');
                
                setTimeout(() => {
                    tg.close();
                }, 2000);

            } catch (error) {
                console.error('Submit error:', error);
                showMessage('error', '⚠️ সমস্যা হয়েছে! আবার চেষ্টা করুন।');
                submitBtn.disabled = false;
                submitBtn.textContent = 'সেল রিকোয়েস্ট পাঠান ✓';
            }
        }

        // Event listeners
        document.getElementById('coinSelect').addEventListener('change', updateCalculation);
        document.getElementById('amountInput').addEventListener('input', updateCalculation);

        // Initialize
        window.addEventListener('load', loadCoins);
    </script>
</body>
</html>
